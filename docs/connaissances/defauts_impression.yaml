  causes:
  - Usure du roulement, poussière, câble coupé, filament dans l'hélice
  corrections_immediates:
  - PAUSE et TURN_OFF_HEATERS si le ventilateur est arrêté (évite le heat creep et la surchauffe du support de tête)
  corrections_durables:
  - Remplacer le ventilateur, ajouter surveillance tachymétrique
  - Nettoyer régulièrement
  specifique_cr10s: Sur le CR-10S, le ventilateur de radiateur est piloté de façon fixe sur certaines versions ;
