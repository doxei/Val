  - 'TMC seulement : SET_TMC_CURRENT STEPPER=<nom> CURRENT=<plus bas> (risque de perte de couple)'
  corrections_durables:
  - Ventiler le boîtier, dissipateurs
  - Courant moteur adapté (moteur tiède, pas brûlant)
  - Nettoyer les filtres/ventilateurs
  specifique_cr10s: 'Boîtier électronique séparé du CR-10S avec ventilateur : le vérifier ; pilotes de la carte
