# Base de connaissances : défauts d'impression FDM, signes précurseurs et corrections
# Machine cible : Creality CR-10S (2017), Bowden, plateau 300x300, Klipper + Moonraker, caméra
# Langue : fr | version 1.0 | 2026-10-08
# Format : liste d'entrées (une par défaut).
# Conventions :
#   moment_typique : premiere_couche | debut | milieu | fin | tout_moment
#   gravite : 1 cosmétique ; 2 défaut de qualité ; 3 pièce perdue ; 4 pièce perdue + risque matériel ; 5 risque sécurité/incendie
#   detectable_camera : oui (visible directement) | partiel (tardif ou selon l'angle) | non (télémétrie ou son nécessaires)
#   corrections_immediates : les actions préfixées [RISQUÉ] peuvent abîmer la pièce/la machine ou exposer l'opérateur -> confirmation humaine.
#   Commandes : <valeur> = à remplacer. M106/M107 pilotent le ventilateur [fan] ; SET_FAN_SPEED ne vaut que pour [fan_generic].
# Synthèse rédigée avec nos propres mots à partir des sources citées ; vérifier les valeurs sur sa machine.
# Ne jamais désactiver les protections thermiques (verify_heater).
- id: decollement_spaghetti
  titre: Pièce décollée du plateau puis « spaghetti » (filament extrudé dans le vide)
  categorie: adhesion
  symptomes_visuels:
  - Amas de fils emmêlés, tortillés, sans forme géométrique, qui grossit couche après couche
  - La pièce n'est plus à sa place initiale, a glissé ou s'est couchée, ou reste collée à la buse
  - La buse se déplace au-dessus du vide ou au-dessus d'un tas désordonné
  - Filament qui pend sous la buse au lieu d'être déposé sur la couche précédente
  signes_precurseurs:
  - Coins ou bords qui se soulèvent progressivement (voir warping) dans les couches précédentes
  - Première couche mal écrasée, lignes rondes et séparées, ou zones brillantes non collées
  - Petits déplacements latéraux de la pièce quand la buse passe (visibles en comparant deux images successives)
  - Bruit de frottement ou claquement quand la buse heurte un bord relevé
  - Hauteur visible de la pièce qui cesse d'augmenter alors que la position Z continue de monter
  - Courant d'air froid ou chute de la température du plateau (télémétrie heater_bed)
  moment_typique: debut
  point_de_non_retour: 'Dès que la pièce a bougé par rapport à l''origine du plateau : aucune reprise possible,
    chaque couche suivante est déposée dans le vide.'
  causes:
  - 'Adhérence insuffisante : surface grasse, première couche trop haute, plateau trop froid'
  - Retrait thermique (warping) qui arrache les coins puis la pièce entière
  - Collision buse/pièce (surplomb relevé, blob, bourrelet) qui pousse la pièce
  - Surface de contact trop petite pour la hauteur (tour fine, pièce haute et étroite)
  - Courant d'air, ventilateur de pièce trop fort sur les premières couches
  corrections_immediates:
  - PAUSE immédiat dès les premiers signes de mouvement de la pièce, puis CANCEL_PRINT si la pièce a bougé
  - 'Si plusieurs objets : EXCLUDE_OBJECT NAME=<objet> pour abandonner seulement la pièce décollée (nécessite [exclude_object]
    et un G-code étiqueté)'
  - '[RISQUÉ] Tenter de recoller/maintenir la pièce à la main pendant l''impression : risque de brûlure et de collision,
    seulement si la pièce n''a pas encore bougé'
  - Couper la chauffe buse si un amas commence à envelopper le bloc chauffant (TURN_OFF_HEATERS après PAUSE) pour
    éviter le blob of doom
  corrections_durables:
  - Nettoyer le plateau à l'alcool isopropylique (≥ 90 %) avant chaque impression ; ne pas toucher la surface avec
    les doigts
  - Recalibrer la hauteur de première couche (Z offset) et le maillage du plateau
  - Ajouter bordure (brim), oreilles de souris ou radeau pour les pièces hautes/étroites ou en matériaux qui se
    rétractent
  - Réduire le ventilateur sur les 2–3 premières couches et la vitesse de première couche
  - Orienter la pièce pour maximiser la surface au contact du plateau
  - Activer le Z-hop (0,2–0,3 mm) si les collisions avec des surplombs relevés sont la cause
  specifique_cr10s: 'Plateau de 300×300 mm : les bords sont souvent plus froids que le centre et l''aluminium d''origine
    est rarement plat, d''où des décollements plus fréquents près des coins. Placer les pièces critiques au centre.
    Sans palpeur d''origine, le maillage doit être manuel ou nécessite un BLTouch.'
  gravite: 3
  detectable_camera: oui
  sources:
  - https://www.obico.io/blog/how-obico-ai-failure-detection-works/
  - https://github.com/TheSpaghettiDetective/obico-server
  - https://help.prusa3d.com/en/article/warping_2011/
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
  - https://www.klipper3d.org/Exclude_Object.html
  - https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/layer_shifting.html
- id: warping_coins_releves
  titre: 'Warping : coins et bords qui se relèvent'
  categorie: adhesion
  symptomes_visuels:
  - Coins de la pièce qui se décollent du plateau, formant un jour visible entre plateau et pièce
  - Base courbée « en banane » sur les grandes pièces
  - Bordure (brim) qui se soulève aux angles
  - Fissure horizontale ou décalage dans les couches basses au-dessus d'un coin relevé
  signes_precurseurs:
  - Léger reflet ou ombre sous un coin vu de profil, qui s'agrandit sur quelques couches
  - Coins de la première couche moins écrasés que le centre
  - Plateau qui peine à maintenir sa consigne (puissance de chauffe élevée en continu)
  - Matériau à fort retrait (ABS, ASA, PC, nylon) imprimé sans enceinte
  - Température ambiante basse ou courant d'air près de l'imprimante
  moment_typique: debut
  point_de_non_retour: Quand le coin relevé dépasse la hauteur de couche suivante (risque de collision) ou que la
    pièce bascule ; avant cela, l'impression peut finir avec un défaut de planéité.
  causes:
  - Retrait thermique du plastique en refroidissant, qui tire sur les bords
  - Adhérence trop faible ou surface sale
  - Refroidissement trop fort pour ABS/ASA/PC ; courant d'air
  - Angles vifs et grandes surfaces pleines
  - Plateau trop froid ou inhomogène
  corrections_immediates:
  - Couper les courants d'air (fermer fenêtre, poser un carton ou fermer l'enceinte)
  - Réduire la ventilation pièce avec M106 S<valeur> (ex. M106 S0 à S51 pour ABS)
  - '[RISQUÉ] Augmenter la température du plateau de 5 °C : SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=<consigne+5>
    (efficacité limitée une fois le coin décollé ; risque de pied d''éléphant)'
  - 'Si le coin relevé menace la buse : PAUSE puis décider d''annuler ; activer un Z-hop n''est pas possible en
    cours d''impression sans G-code modifié'
  corrections_durables:
  - Bordure large (5–10 mm), oreilles de souris ou petites pastilles aux angles
  - Enceinte ou draft shield (jupe-paroi) pour ABS/ASA/PC
  - Nettoyage du plateau, adhésif adapté (colle en bâton, laque) selon la surface
  - Arrondir les angles vifs à la conception, réduire le remplissage dense
  - Imprimer plus lentement les premières couches et vérifier le Z offset
  specifique_cr10s: 'Grand plateau aluminium 300×300 : gradient thermique fort entre centre et bords. Laisser le
    plateau chauffer et se stabiliser plusieurs minutes avant de lancer (le cadre et le verre ou la surface mettent
    du temps). L''imprimante est ouverte : ABS/ASA quasi impossibles sans enceinte.'
  gravite: 3
  detectable_camera: partiel
  sources:
  - https://help.prusa3d.com/en/article/warping_2011/
  - https://matterhackers.com/articles/3d-printer-troubleshooting-guide
  - https://help.prusa3d.com/fr/article/abs_2058
  - https://www.creality.com/blog/3d-printing-curling
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
- id: premiere_couche_trop_haute
  titre: Première couche trop haute (buse trop éloignée)
  categorie: adhesion
  symptomes_visuels:
  - Lignes rondes, étroites, séparées par des espaces ; on voit le plateau entre les traits
  - Lignes qui se déplacent ou se tortillent derrière la buse
  - Jupe ou bordure qui se décolle quand la buse revient à côté
  - Surface inférieure de la pièce brillante et lisse comme des cordons
  signes_precurseurs:
  - 'Dès la jupe (skirt) : trait fin et rond plutôt qu''aplati'
  - Lignes qui ne se soudent pas entre elles sur les premiers centimètres
  - Z offset récemment modifié, changement de buse ou de plateau
  - Maillage du plateau ancien ou non chargé (BED_MESH_PROFILE LOAD non appelé)
  moment_typique: premiere_couche
  point_de_non_retour: 'Pendant la première couche : rattrapable en baissant Z. Une fois la deuxième couche commencée
    sur une base mal collée, le risque de décollement plus tard devient élevé.'
  causes:
  - Z offset trop grand ou mal calibré
  - Plateau non nivelé, maillage absent ou périmé
  - 'Dilatation thermique : calibrage fait à froid'
  - Portique X incliné (moteurs Z désynchronisés)
  corrections_immediates:
  - 'Abaisser la buse par petits pas pendant la première couche : SET_GCODE_OFFSET Z_ADJUST=-0.02 MOVE=1 (répéter,
    observer)'
  - 'Si la jupe est ratée : CANCEL_PRINT, recalibrer et relancer (coûte peu à ce stade)'
  - 'Après réglage satisfaisant : Z_OFFSET_APPLY_ENDSTOP ou Z_OFFSET_APPLY_PROBE puis SAVE_CONFIG (hors impression)
    pour mémoriser'
  corrections_durables:
  - Calibrer le Z offset à température d'impression (plateau et buse chauds)
  - Refaire le maillage (BED_MESH_CALIBRATE) et le charger dans le G-code de début
  - Imprimer un test de première couche (carrés de 25 mm) et ajuster
  - Vérifier le parallélisme du portique X avec le plateau
  specifique_cr10s: 'Sans palpeur d''origine, le CR-10S se règle au papier ou au BED_SCREWS_ADJUST/MANUAL_PROBE
    ; double vis Z sur un seul pilote : si on tourne une vis à la main moteurs coupés, le portique se penche et
    la première couche devient haute d''un côté seulement.'
  gravite: 3
  detectable_camera: oui
  sources:
  - https://www.klipper3d.org/Bed_Mesh.html
  - https://www.klipper3d.org/G-Codes.html
  - https://teachingtechyt.github.io/calibration.html
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
  - https://ellis3dp.com/Print-Tuning-Guide/
- id: premiere_couche_trop_basse
  titre: Première couche trop basse (buse trop proche)
  categorie: adhesion
  symptomes_visuels:
  - Surface très plate, translucide, avec crêtes ou bourrelets de matière entre les lignes
  - Zones où rien ne sort (buse bouchée par le plateau), surface rayée
  - Matière qui s'accumule et forme des vagues ou des écailles
  - Pied d'éléphant marqué sur les couches suivantes
  signes_precurseurs:
  - Claquement de l'extrudeur pendant la première couche (pression trop forte)
  - Bourrelets latéraux visibles le long de la jupe
  - Lignes d'aspect transparent ou très fin sur la jupe
  moment_typique: premiere_couche
  point_de_non_retour: Rattrapable durant la première couche ; si la buse a raclé le plateau et s'est bouchée, il
    faut arrêter.
  causes:
  - Z offset trop petit
  - Plateau bombé non compensé
  - Débit de première couche trop élevé
  - Changement de surface (épaisseur différente) sans recalage
  corrections_immediates:
  - 'Remonter la buse : SET_GCODE_OFFSET Z_ADJUST=+0.02 MOVE=1'
  - 'Réduire le débit temporairement : M221 S95 (penser à revenir à M221 S100 ensuite)'
  - 'Si l''extrudeur claque fort ou rien ne sort : CANCEL_PRINT, vérifier que la buse n''est pas obstruée'
  corrections_durables:
  - Recalibrer le Z offset et le maillage
  - Réduire le débit/largeur de première couche dans le trancheur
  - Activer la compensation de pied d'éléphant
  - Vérifier l'état de la surface (rayures)
  specifique_cr10s: ''
  gravite: 2
  detectable_camera: oui
  sources:
  - https://teachingtechyt.github.io/calibration.html
  - https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/extruder_skipping.html
  - https://www.wevolver.com/article/3d-printing-elephant-foot
  - https://www.klipper3d.org/G-Codes.html
- id: perte_adherence_en_cours
  titre: Perte d'adhérence au milieu de l'impression
  categorie: adhesion
  symptomes_visuels:
  - Pièce qui oscille légèrement à chaque passage de la buse
  - Base qui commence à se décoller sur un côté alors que les premières couches étaient bonnes
  - 'Brusque translation de toute la pièce (à distinguer d''un décalage de couche : ici tout bouge, y compris la
    première couche)'
  signes_precurseurs:
  - Coins qui se relèvent progressivement au-delà de quelques couches (warping lent)
  - Pièce haute dont le bras de levier augmente (tour mince, centre de gravité haut)
  - Coupure ou chute de la chauffe du plateau (télémétrie heater_bed sous la consigne)
  - Vibrations fortes du plateau aux changements de direction en Y (accélérations élevées)
  - Buse qui frotte sur la surface (bruit de raclage) à cause de surplombs relevés
  moment_typique: milieu
  point_de_non_retour: 'Dès que la base s''est déplacée : la suite est imprimée à côté et devient du spaghetti.'
  causes:
  - Contraintes internes accumulées (retrait) qui finissent par vaincre l'adhérence
  - Plateau qui refroidit (consigne baissée, défaut de chauffe, PLA sur plateau trop chaud qui se ramollit dans
    certains cas)
  - Accélérations élevées sur un plateau mobile lourd avec pièce haute
  - Chocs de la buse sur des surplombs recourbés
  corrections_immediates:
  - PAUSE pour inspection si la pièce bouge légèrement
  - 'Réduire vitesse et accélérations : M220 S70 et SET_VELOCITY_LIMIT ACCEL=1000'
  - '[RISQUÉ] Coller la base avec du ruban ou de la colle chaude pendant la pause : faisable si la pièce n''a pas
    bougé, risque de déplacer l''origine'
  - Vérifier que la consigne du plateau est toujours active (SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=<consigne>)
  corrections_durables:
  - Bordure, oreilles de souris, ou ajout de renforts à la conception
  - Limiter max_accel pour les pièces hautes sur ce type d'imprimante (plateau mobile)
  - Activer un Z-hop modéré pour éviter les collisions
  - Vérifier l'alimentation et le connecteur du plateau (chute de chauffe intermittente)
  specifique_cr10s: 'Plateau Y lourd (300 mm) : l''inertie secoue les pièces hautes ; garder des accélérations Y
    raisonnables et utiliser l''input shaper mesuré.'
  gravite: 3
  detectable_camera: oui
  sources:
  - https://help.prusa3d.com/en/article/warping_2011/
  - https://www.klipper3d.org/Resonance_Compensation.html
  - https://www.obico.io/blog/how-obico-ai-failure-detection-works/
  - https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/layer_shifting.html
- id: piece_renversee_par_buse
  titre: Pièce renversée ou arrachée par la buse
  categorie: adhesion
  symptomes_visuels:
  - Pièce couchée sur le flanc ou absente de sa position
  - Support ou petite pièce arrachée et traînée
  - Buse qui continue à imprimer au-dessus d'un emplacement vide
  signes_precurseurs:
  - Bords ou surplombs recourbés vers le haut sur les couches précédentes
  - Bruit de choc (« clac ») à chaque passage au même endroit
  - Blob ou paquet de matière accroché à la buse
  - Pièce fine/haute qui vacille visuellement
  moment_typique: milieu
  point_de_non_retour: Au moment du renversement ; avant, la collision répétée peut être stoppée par une pause.
  causes:
  - Surplombs ou coins qui se recourbent (refroidissement insuffisant)
  - Sur-extrusion qui fait monter des bourrelets
  - Absence de Z-hop
  - Pièce trop élancée ou supports trop fins
  - Matière accumulée sur la buse
  corrections_immediates:
  - PAUSE dès qu'un choc répété est entendu ou vu
  - 'Si plusieurs objets : EXCLUDE_OBJECT NAME=<objet> pour l''objet menacé'
  - 'Augmenter le refroidissement : M106 S255 (PLA)'
  - 'Réduire le débit si la cause est une sur-extrusion : M221 S95'
  corrections_durables:
  - Z-hop 0,2–0,4 mm, ou Z-hop seulement au-dessus des parties imprimées
  - Meilleur refroidissement des surplombs, vitesse réduite sur surplombs
  - Ajouter bordure et renforts (oreilles, nervures) aux pièces élancées
  - Calibrer le débit (extrusion multiplier)
  specifique_cr10s: ''
  gravite: 3
  detectable_camera: oui
  sources:
  - https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/layer_shifting.html
  - https://help.prusa3d.com/en/article/layer-shifting_2020
  - https://www.klipper3d.org/Exclude_Object.html
  - https://www.creality.com/blog/3d-printing-curling
- id: pied_elephant
  titre: Pied d'éléphant (base évasée)
  categorie: geometrie
  symptomes_visuels:
  - Les premières couches dépassent vers l'extérieur et forment un bourrelet à la base
  - Base plus large que le reste de la paroi, souvent visible sur les cubes de test
  signes_precurseurs:
  - Première couche très écrasée (voir première couche trop basse)
  - Plateau réglé en haut de la plage recommandée
  - Pièce lourde ou à remplissage dense qui pèse sur des couches basses encore molles
  moment_typique: premiere_couche
  point_de_non_retour: Défaut dimensionnel, jamais irrécupérable pour l'impression elle-même ; non corrigeable après
    coup sauf ponçage.
  causes:
  - Plateau trop chaud qui garde les couches basses molles
  - Buse trop proche du plateau
  - Débit de première couche > 100 %
  - Refroidissement faible sur les premières couches
  corrections_immediates:
  - 'Remonter légèrement la buse pendant la première couche : SET_GCODE_OFFSET Z_ADJUST=+0.01 MOVE=1'
  - 'Baisser le plateau de 5 °C après la première couche : SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=<consigne-5>'
  corrections_durables:
  - Compensation de pied d'éléphant (PrusaSlicer) / expansion horizontale négative de la couche initiale (Cura),
    égale à l'évasement mesuré
  - Chanfrein à la base dans le modèle CAO
  - Plateau au bas de la plage du fabricant, débit de première couche 95–100 %
  specifique_cr10s: ''
  gravite: 1
  detectable_camera: partiel
  sources:
  - https://www.wevolver.com/article/3d-printing-elephant-foot
  - https://matterhackers.com/articles/3d-printer-troubleshooting-guide
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
- id: decalage_couches
  titre: Décalage de couches (layer shift) en X ou Y
  categorie: mecanique
  symptomes_visuels:
  - 'Marche d''escalier nette : toutes les couches au-dessus d''une hauteur donnée sont décalées dans une direction'
  - Plusieurs marches successives (escalier) si la poulie patine
  - Impression qui continue « à côté » de la pièce, parfois dans le vide
  signes_precurseurs:
  - Bruit de claquement/grognement du moteur X ou Y (pas perdus)
  - Chocs de la buse sur des surplombs recourbés ou un blob
  - Moteurs ou pilotes très chauds (impression longue, enceinte)
  - Accélérations ou vitesses récemment augmentées
  - Courroie qui semble molle, poussière de courroie près des poulies
  - 'Commande GET_POSITION : écart entre position commandée et compteur de pas après un choc (diagnostic hors impression)'
  moment_typique: tout_moment
  point_de_non_retour: Le premier décalage rend la pièce non conforme ; si le décalage est petit (< 1 mm) et la
    pièce décorative, on peut laisser finir. Un grand décalage mène au spaghetti.
  causes:
  - Poulie dont la vis sans tête est desserrée (cause n°1 des décalages en escalier)
  - Courroie trop lâche ou trop tendue, mal alignée
  - Collision buse/pièce (surplomb relevé, blob)
  - Vitesse/accélération au-delà de ce que le moteur peut fournir
  - Pilote moteur en surchauffe, courant moteur mal réglé
  - Câble ou sertissage défectueux, point dur sur un axe
  corrections_immediates:
  - PAUSE dès le bruit de pas perdus pour inspecter (pièce encore récupérable si aucun décalage visible)
  - 'Réduire immédiatement : M220 S60 et SET_VELOCITY_LIMIT ACCEL=800 SQUARE_CORNER_VELOCITY=5'
  - '[RISQUÉ] Tenter de recaler un petit décalage avec SET_GCODE_OFFSET X_ADJUST=<mm> ou Y_ADJUST=<mm> : précision
    très incertaine, seulement pour pièces non critiques'
  - 'Si le décalage est important : CANCEL_PRINT'
  corrections_durables:
  - Resserrer les vis sans tête des poulies (une sur le méplat de l'axe)
  - Régler la tension des courroies (par fréquence de préférence) et vérifier leur trajet
  - Mesurer l'input shaper et fixer max_accel en conséquence
  - Refroidir les pilotes, vérifier le courant moteur
  - Z-hop et meilleur refroidissement pour éviter les collisions
  - 'Vérifier les galets excentriques (V-slot) : ni jeu ni point dur'
  specifique_cr10s: 'Axe Y = plateau 300×300 lourd : c''est l''axe le plus exposé aux pas perdus à forte accélération.
    Galets V-slot sur extrusions : un galet trop serré crée un point dur, trop lâche un jeu. Sur la carte d''origine,
    le courant moteur ne se règle pas par logiciel (aucune section TMC dans l''exemple de config Klipper).'
  gravite: 4
  detectable_camera: oui
  sources:
  - https://help.prusa3d.com/en/article/layer-shifting_2020
  - https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/layer_shifting.html
  - https://www.klipper3d.org/FAQ.html
  - https://www.klipper3d.org/Resonance_Compensation.html
  - https://www.klipper3d.org/G-Codes.html
  - https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-cr10s-2017.cfg
- id: ringing_ghosting
  titre: Ringing / ghosting (ondulations après les angles)
  categorie: mecanique
  symptomes_visuels:
  - Échos répétés d'un angle ou d'un détail (lettres, trous) sur la surface qui suit
  - Ondulations régulières qui s'atténuent en s'éloignant de l'angle
  - Plus marqué sur les faces parallèles à l'axe le plus lourd (Y sur plateau mobile)
  signes_precurseurs:
  - Aucune menace pour la réussite ; signe d'accélérations trop élevées pour la rigidité
  - Vibration audible du cadre ou du plateau aux changements de direction
  - Augmentation des vitesses/accélérations, courroies détendues, pièce de la tête modifiée
  moment_typique: tout_moment
  point_de_non_retour: Défaut purement esthétique, jamais bloquant.
  causes:
  - Vibrations mécaniques (cadre peu rigide, courroies, masse mobile élevée)
  - Accélérations trop fortes
  - Input shaper absent ou mal réglé (fréquence erronée)
  corrections_immediates:
  - 'Réduire les accélérations : SET_VELOCITY_LIMIT ACCEL=1500'
  - 'Activer/ajuster l''input shaper si déjà mesuré : SET_INPUT_SHAPER SHAPER_FREQ_X=<f> SHAPER_FREQ_Y=<f> SHAPER_TYPE=mzv'
  corrections_durables:
  - Corriger d'abord la mécanique (cadre, courroies, vis, galets)
  - Mesurer les résonances (tour de ringing ou accéléromètre ADXL345 avec TEST_RESONANCES / SHAPER_CALIBRATE)
  - Choisir le shaper (MZV par défaut, EI si fréquence instable) et fixer max_accel selon ringing et lissage
  - Refaire le réglage de pressure advance après un changement d'input shaper
  - Garder square_corner_velocity à la valeur par défaut
  specifique_cr10s: 'Plateau mobile lourd : fréquence de résonance Y basse ; en dessous de ~20–25 Hz le lissage
    devient fort, il faut alors rigidifier ou utiliser ZV. Pour un plateau mobile, l''accéléromètre se monte sur
    le plateau pour l''axe Y.'
  gravite: 1
  detectable_camera: partiel
  sources:
  - https://www.klipper3d.org/Resonance_Compensation.html
  - https://www.klipper3d.org/Measuring_Resonances.html
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
  - https://teachingtechyt.github.io/calibration.html
- id: z_banding_wobble
  titre: Z-banding / Z-wobble (bandes horizontales régulières)
  categorie: mecanique
  symptomes_visuels:
  - Bandes ou côtes horizontales périodiques sur les parois
  - Paroi qui ondule légèrement en XY de façon périodique avec la hauteur (wobble)
  - Motif régulier dont la période correspond souvent au pas de la vis trapézoïdale (8 mm)
  signes_precurseurs:
  - Défaut cosmétique, pas un précurseur d'échec
  - Oscillation périodique de la température du plateau (régulation bang-bang ou PID mal réglé) synchronisée avec
    les bandes
  - Vis Z voilée visible lorsqu'elle tourne, accouplement desserré
  moment_typique: tout_moment
  point_de_non_retour: Esthétique uniquement.
  causes:
  - Vis trapézoïdale voilée ou mal alignée, accouplement desserré
  - Écrou de vis trop contraint, portique qui frotte
  - Hauteur de couche non multiple d'un pas moteur entier
  - Température buse ou plateau qui oscille
  - Extrusion irrégulière
  corrections_immediates:
  - Aucune correction utile en cours, sauf stabiliser la température (vérifier la courbe dans Mainsail/Fluidd)
  corrections_durables:
  - Vérifier la rectitude des vis Z et le serrage des accouplements
  - Choisir des hauteurs de couche multiples du pas complet (rotation_distance 8 mm, 200 pas/tour → 0,04 mm)
  - PID_CALIBRATE HEATER=heater_bed TARGET=<consigne> puis SAVE_CONFIG
  - Lubrifier les vis, laisser une liberté à l'écrou (découplage)
  specifique_cr10s: Le CR-10S a deux vis Z entraînées par deux moteurs en parallèle ; un léger désaccord entre les
    deux côtés peut produire des bandes asymétriques. rotation_distance Z = 8 dans la config d'exemple.
  gravite: 1
  detectable_camera: partiel
  sources:
  - https://www.obico.io/blog/fixing-z-banding-wobble-a-comprehensive-guide/
  - https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-cr10s-2017.cfg
  - https://www.klipper3d.org/Config_checks.html
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
- id: gantry_z_desynchronise
  titre: Portique X incliné (vis Z gauche/droite désynchronisées)
  categorie: mecanique
  symptomes_visuels:
  - Première couche correcte d'un côté du plateau et trop haute ou trop écrasée de l'autre
  - Pièces placées à gauche et à droite qui n'ont pas la même hauteur
  signes_precurseurs:
  - Mesure à la cale/papier différente aux deux extrémités du portique
  - Moteurs coupés (M84) puis une vis tournée à la main ou portique poussé
  - Bruit de saut de pas sur un moteur Z en montée
  moment_typique: premiere_couche
  point_de_non_retour: Pas de point de non-retour en soi, mais conduit au décollement d'un côté.
  causes:
  - 'Deux moteurs Z sur un seul pilote : ils ne se recalent pas l''un sur l''autre'
  - Accouplement ou poulie qui patine
  - Choc mécanique sur le portique
  corrections_immediates:
  - Rattraper partiellement avec SET_GCODE_OFFSET Z_ADJUST si une seule pièce, sinon CANCEL_PRINT et réaligner
  corrections_durables:
  - Remettre le portique parallèle (cales identiques des deux côtés), éventuellement synchroniser les vis par une
    courroie
  - Refaire le maillage après réalignement (un maillage ne doit pas compenser un portique tordu)
  - Éviter de manipuler le portique moteurs coupés
  specifique_cr10s: Spécifique aux machines à double vis Z sans recalage indépendant comme le CR-10S.
  gravite: 2
  detectable_camera: partiel
  sources:
  - https://www.klipper3d.org/Bed_Mesh.html
  - https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-cr10s-2017.cfg
  - https://www.obico.io/blog/fixing-z-banding-wobble-a-comprehensive-guide/
- id: sous_extrusion
  titre: Sous-extrusion (manque de matière)
  categorie: extrusion
  symptomes_visuels:
  - Lignes fines, trous entre périmètres et remplissage, couches supérieures ajourées
  - Parois translucides ou poreuses, pièce fragile
  - Remplissage filandreux, mal soudé
  signes_precurseurs:
  - Diminution progressive de la largeur de ligne visible sur les parois récentes
  - Claquement intermittent de l'extrudeur (début de bouchon ou débit trop élevé)
  - 'Capteur de mouvement de filament : distance mesurée inférieure à la distance commandée'
  - Température buse qui chute sous la consigne pendant les remplissages rapides (puissance chauffe à 100 %)
  - Bobine qui accroche, Bowden qui frotte, filament marqué par les dents
  moment_typique: tout_moment
  point_de_non_retour: Quand les couches ne se soudent plus (délaminage) ou que l'extrusion s'arrête complètement
    ; une sous-extrusion légère et stable donne seulement une pièce faible.
  causes:
  - Débit volumique supérieur à la capacité de fusion de la tête
  - Bouchon partiel, buse usée ou sale
  - rotation_distance de l'extrudeur faux
  - Tension du galet presseur incorrecte
  - Filament humide ou de diamètre variable
  - Friction dans le Bowden ou à la bobine
  - Heat creep
  - Température trop basse
  corrections_immediates:
  - 'Augmenter le débit : M221 S105 à S110 (palliatif si la cause est mécanique)'
  - 'Réduire la vitesse pour rester dans la capacité de fusion : M220 S70'
  - '[RISQUÉ] Augmenter la température de 5–10 °C : SET_HEATER_TEMPERATURE HEATER=extruder TARGET=<consigne+5> (risque
    de stringing, ne pas dépasser la limite du liner PTFE)'
  - Vérifier visuellement la bobine et libérer le filament s'il accroche
  corrections_durables:
  - Calibrer rotation_distance (marque, extrusion lente de 50 mm, mesure)
  - Calibrer le multiplicateur d'extrusion (paroi simple mesurée au pied à coulisse)
  - Déterminer le débit volumique max de la tête et le limiter dans le trancheur
  - Nettoyer ou remplacer la buse, cold pull
  - Sécher le filament
  - Régler la tension du galet presseur, nettoyer les dents
  specifique_cr10s: 'Bowden long : la pression met du temps à s''établir, la sous-extrusion apparaît d''abord après
    les rétractions et dans les remplissages rapides. Tête d''origine à liner PTFE (max_temp 250 °C dans l''exemple
    Klipper) : capacité de fusion modeste, ne pas compter sur des débits élevés.'
  gravite: 3
  detectable_camera: partiel
  sources:
  - https://help.prusa3d.com/en/article/under-extrusion_2007
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
  - https://www.klipper3d.org/Rotation_Distance.html
  - https://teachingtechyt.github.io/calibration.html
  - https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/extruder_skipping.html
  - https://link.springer.com/article/10.1007/s40964-019-00089-3
  - https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-cr10s-2017.cfg
- id: sur_extrusion
  titre: Sur-extrusion (excès de matière)
  categorie: extrusion
  symptomes_visuels:
  - Parois bombées, surfaces grasses, bourrelets sur les bords
  - Couches supérieures rugueuses avec crêtes
  - Trous et ajustements trop serrés
  - Matière accumulée sur la buse qui laisse des traces
  signes_precurseurs:
  - Buse qui traîne dans la couche précédente (bruit de frottement)
  - Amas qui se forment aux angles et grossissent
  - Calibrage récent de rotation_distance ou de débit
  moment_typique: tout_moment
  point_de_non_retour: Rarement irrécupérable ; devient grave si les bourrelets provoquent une collision ou un blob.
  causes:
  - Multiplicateur d'extrusion trop élevé
  - rotation_distance trop petit
  - Diamètre de filament réel inférieur au réglage
  - Largeur de ligne/hauteur mal réglées
  corrections_immediates:
  - 'Réduire le débit : M221 S95 (pas de 2–5 %)'
  - 'Si la buse frotte fortement : PAUSE puis vérifier'
  corrections_durables:
  - Calibrer le multiplicateur d'extrusion et rotation_distance
  - Mesurer le diamètre du filament en plusieurs points
  specifique_cr10s: ''
  gravite: 2
  detectable_camera: partiel
  sources:
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
  - https://teachingtechyt.github.io/calibration.html
  - https://www.klipper3d.org/Rotation_Distance.html
  - https://ellis3dp.com/Print-Tuning-Guide/
- id: bouchon_partiel_buse
  titre: Bouchon partiel de la buse
  categorie: extrusion
  symptomes_visuels:
  - Lignes irrégulières, plus fines par endroits, trous aléatoires
  - Filament qui sort de travers ou en boucle lors d'une purge
  - Surface supérieure striée de manques
  signes_precurseurs:
  - Claquement périodique de l'extrudeur
  - 'Capteur de mouvement : glissement entre commande et mouvement réel'
  - 'Courant moteur extrudeur plus élevé pour le même débit (si mesurable) : la recherche montre une hausse de courant
    quand le diamètre effectif de la buse diminue'
  - Changement récent de filament à température plus haute (résidus carbonisés)
  - Particules ou poussière sur le filament
  moment_typique: tout_moment
  point_de_non_retour: Quand la sous-extrusion devient assez forte pour que les couches ne se soudent plus ou que
    le bouchon devient complet.
  causes:
  - Résidus carbonisés, poussière, particules (charges, pigments)
  - Ancien filament haute température resté dans la buse
  - Liner PTFE dégradé ou décollé de la buse (CR-10S)
  - Heat creep
  corrections_immediates:
  - 'Réduire vitesse et augmenter légèrement la température : M220 S70, SET_HEATER_TEMPERATURE HEATER=extruder TARGET=<+5>'
  - 'Augmenter le débit en palliatif : M221 S105'
  - '[RISQUÉ] PAUSE puis tentative de purge/aiguille à chaud : la pièce peut être abîmée par la reprise (voir pause_reprise_defectueuse)'
  corrections_durables:
  - Cold pull (tirage à froid) répété
  - Aiguille 0,3–0,35 mm par le dessous, à chaud
  - Remplacer la buse, nettoyer l'entrée PTFE
  - Filtre à poussière sur le filament
  - Purger à la température la plus haute utilisée lors d'un changement de matière
  specifique_cr10s: 'Vérifier en priorité que le tube PTFE descend bien jusqu''à la buse : un jeu crée un bouchon
    récurrent (voir bowden_espace_ptfe).'
  gravite: 3
  detectable_camera: partiel
  sources:
  - https://help.prusa3d.com/article/WWVRzOY1dX-clogged-nozzle
  - https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/extruder_skipping.html
  - https://link.springer.com/article/10.1007/s40964-019-00089-3
  - https://3dprintingspace.com/t/crs10s-clogging-after-a-certain-height/5452
- id: arret_extrusion_bouchon_complet
  titre: Arrêt complet de l'extrusion en cours d'impression
  categorie: extrusion
  symptomes_visuels:
  - La tête continue de bouger mais plus rien ne se dépose
  - La pièce cesse de grandir, les couches supérieures disparaissent
  - Fins filaments ou aucun dépôt sur les déplacements
  signes_precurseurs:
  - Sous-extrusion croissante sur les dernières couches
  - Claquement de l'extrudeur de plus en plus fréquent
  - Capteur de mouvement de filament qui ne voit plus de mouvement (déclenche runout si configuré)
  - Ventilateur de radiateur arrêté ou température ambiante élevée (heat creep)
  - Filament creusé par l'engrenage (grinding)
  moment_typique: milieu
  point_de_non_retour: 'Dès quelques couches sans dépôt : la reprise laisse une ligne de faiblesse ; au-delà, la
    pièce est perdue.'
  causes:
  - Bouchon complet de buse
  - Heat creep
  - Filament grignoté
  - Fin ou nœud de bobine
  - Liner PTFE déformé
  corrections_immediates:
  - PAUSE immédiat (l'impression sans dépôt n'a aucune valeur)
  - 'Diagnostiquer : filament présent ? engrenage qui tourne ? filament creusé ?'
  - '[RISQUÉ] Si le problème est réglé, RESUME : risque de mauvaise reprise en Z et de couche manquante'
  corrections_durables:
  - Capteur de mouvement de filament ([filament_motion_sensor], detection_length adapté au Bowden)
  - Traiter la cause (voir heat creep, grinding, bouchon)
  specifique_cr10s: 'Le capteur d''origine du CR-10S est un simple interrupteur de présence : il ne détecte pas
    un bouchon. Un capteur à encodeur (motion sensor) détecte aussi l''arrêt du défilement.'
  gravite: 4
  detectable_camera: oui
  sources:
  - https://help.prusa3d.com/article/extrusion-stopped-mid-print-heat-creep_1948
  - https://help.prusa3d.com/article/WWVRzOY1dX-clogged-nozzle
  - https://www.klipper3d.org/Config_Reference.html
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
  - https://www.mdpi.com/1424-8220/18/3/749
- id: heat_creep
  titre: Heat creep (filament qui ramollit trop haut dans le radiateur)
  categorie: thermique
  symptomes_visuels:
  - Sous-extrusion qui s'aggrave puis arrêt complet de l'extrusion
  - Filament retiré avec une extrémité gonflée en champignon
  signes_precurseurs:
  - Ventilateur du radiateur de la tête ralenti, bruyant ou arrêté (vérifiable à l'oreille, par la caméra si visible,
    ou par tachymètre si câblé)
  - Température ambiante élevée, enceinte fermée avec PLA
  - Impressions lentes avec beaucoup de rétractions (le filament reste longtemps dans la zone chaude)
  - Claquement de l'extrudeur qui commence après un temps long d'impression
  - Augmentation de la température mesurée par un capteur placé sur le radiateur ([temperature_sensor])
  moment_typique: milieu
  point_de_non_retour: 'Quand le filament s''est bloqué dans le radiateur : l''impression ne peut plus reprendre
    sans démontage ou tirage.'
  causes:
  - Refroidissement du radiateur insuffisant (ventilateur, poussière, pâte thermique)
  - Ambiance trop chaude (> ~30–35 °C)
  - Rétractions trop longues ou trop nombreuses
  - Température de buse trop haute
  - Débit très faible (petites pièces lentes)
  corrections_immediates:
  - Ouvrir l'enceinte / ventiler la pièce
  - 'Augmenter légèrement la vitesse pour augmenter le débit : M220 S110 (si la qualité le permet)'
  - 'Réduire la longueur de rétraction si firmware_retraction : SET_RETRACTION RETRACT_LENGTH=<plus court>'
  - 'Si l''extrusion s''est arrêtée : PAUSE'
  corrections_durables:
  - Vérifier/remplacer le ventilateur du radiateur, le nettoyer, contrôler son sens de soufflage
  - Pâte thermique sur le filetage du heatbreak (selon conception)
  - Ne pas imprimer de PLA en enceinte fermée
  - Rétractions plus courtes
  - Décharger le filament à chaud en fin d'impression
  - Surveiller le ventilateur via tachometer_pin dans [heater_fan] si le matériel le permet
  specifique_cr10s: Sur la tête d'origine à liner PTFE, le PTFE limite la remontée de chaleur mais se dégrade si
    on monte trop en température ; un liner décollé de la buse crée un ressaut qui ressemble à un heat creep.
  gravite: 4
  detectable_camera: partiel
  sources:
  - https://help.prusa3d.com/article/extrusion-stopped-mid-print-heat-creep_1948
  - https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/extruder_skipping.html
  - https://www.klipper3d.org/Config_Reference.html
  - https://3dprintingspace.com/t/crs10s-clogging-after-a-certain-height/5452
- id: filament_grignote
  titre: Filament grignoté (grinding) par l'engrenage d'extrusion
  categorie: extrusion
  symptomes_visuels:
  - Extrusion qui faiblit puis s'arrête
  - Poussière de plastique autour de l'extrudeur (visible si filmé)
  - Encoche creusée dans le filament au retrait
  signes_precurseurs:
  - Claquements de l'extrudeur répétés au même endroit du filament
  - Rétractions nombreuses sur la même zone (petits détails, stringing tuning)
  - 'Capteur de mouvement : arrêt du défilement malgré la commande'
  - Température trop basse ou débit trop élevé pour la tête
  moment_typique: milieu
  point_de_non_retour: 'Quand l''engrenage a creusé une gorge : le filament n''avance plus, l''impression est perdue
    sans intervention.'
  causes:
  - Pression trop forte dans la buse (bouchon, température basse, vitesse élevée)
  - Rétraction excessive ou trop rapide
  - Tension du galet presseur trop forte ou trop faible
  - Dents encrassées
  corrections_immediates:
  - PAUSE dès l'arrêt d'extrusion
  - 'Réduire vitesse et augmenter température : M220 S70, SET_HEATER_TEMPERATURE HEATER=extruder TARGET=<+5>'
  - '[RISQUÉ] Couper le filament au-dessus de la zone grignotée, le repousser, puis RESUME : la reprise peut laisser
    un défaut'
  corrections_durables:
  - Réduire longueur et vitesse de rétraction
  - Régler la tension du galet, nettoyer les dents
  - Limiter le débit volumique
  - Extrudeur à double entraînement si le problème se répète
  specifique_cr10s: 'Extrudeur d''origine monté sur le cadre (Bowden) avec levier en plastique sur les premières
    versions : ce levier peut se fissurer et réduire la pression ; à vérifier si le grinding/skip apparaît sans
    autre cause.'
  gravite: 4
  detectable_camera: partiel
  sources:
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
  - https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/extruder_skipping.html
  - https://help.prusa3d.com/article/WWVRzOY1dX-clogged-nozzle
- id: extrudeur_saute_des_pas
  titre: Extrudeur qui saute des pas (clic/claquement)
  categorie: extrusion
  symptomes_visuels:
  - Lignes manquantes répétées à intervalles
  - Sous-extrusion localisée sur les zones rapides
  signes_precurseurs:
  - Son de « clic » caractéristique, détectable par un micro près de l'extrudeur
  - Arrive surtout sur remplissage rapide ou première couche trop écrasée
  - Pressure advance élevé (> ~0,2 en direct, plus en Bowden) combiné à des accélérations fortes
  - Moteur extrudeur chaud
  moment_typique: tout_moment
  point_de_non_retour: Sans conséquence si sporadique ; devient grave s'il conduit au grinding ou au bouchon.
  causes:
  - 'Résistance trop forte : bouchon, température basse, débit volumique trop élevé'
  - Première couche trop basse
  - Courant moteur insuffisant ou pilote trop chaud
  - Pressure advance trop élevé
  - Friction dans le Bowden, bobine qui accroche
  corrections_immediates:
  - 'Réduire la vitesse : M220 S80'
  - 'Réduire pressure advance : SET_PRESSURE_ADVANCE ADVANCE=<valeur-0.1>'
  - 'Augmenter température : SET_HEATER_TEMPERATURE HEATER=extruder TARGET=<+5>'
  - 'Si première couche : SET_GCODE_OFFSET Z_ADJUST=+0.02 MOVE=1'
  corrections_durables:
  - Mesurer le débit volumique maximal et le limiter
  - Vérifier tension galet, état du Bowden et de la bobine
  - 'Régler le courant moteur (TMC : run_current ; sinon potentiomètre Vref)'
  - Re-régler pressure advance
  specifique_cr10s: 'Bowden long : pressure advance typiquement élevé, donc plus de sollicitations brusques du moteur
    extrudeur ; garder des accélérations raisonnables.'
  gravite: 2
  detectable_camera: non
  sources:
  - https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/extruder_skipping.html
  - https://www.klipper3d.org/Pressure_Advance.html
  - https://www.klipper3d.org/TMC_Drivers.html
  - https://help.prusa3d.com/article/WWVRzOY1dX-clogged-nozzle
- id: depassement_debit_volumique
  titre: Dépassement du débit volumique maximal de la tête
  categorie: extrusion
  symptomes_visuels:
  - Sous-extrusion uniquement sur les longues lignes rapides (remplissage), parois correctes
  - Remplissage pâle ou mat (plastique pas assez fondu)
  signes_precurseurs:
  - La température buse baisse de quelques degrés pendant les remplissages rapides puis remonte
  - Claquement de l'extrudeur à vitesse élevée seulement
  - Changement de vitesse ou de largeur de ligne dans le trancheur
  moment_typique: tout_moment
  point_de_non_retour: Pièce faible mais terminée, sauf si cela dégénère en grinding.
  causes:
  - Vitesse × largeur × hauteur de couche au-delà de la capacité de fusion
  corrections_immediates:
  - M220 S70 pour ralentir
  - SET_HEATER_TEMPERATURE HEATER=extruder TARGET=<+5> (prudence avec le liner PTFE)
  corrections_durables:
  - Mesurer le débit max (test d'extrusion à vitesses croissantes) et le fixer dans le trancheur
  - max_extrude_cross_section protège contre des sections aberrantes
  specifique_cr10s: 'Tête d''origine à liner PTFE et bloc chauffant standard : capacité de fusion limitée ; en Klipper
    ne pas pousser les vitesses sans mesure.'
  gravite: 2
  detectable_camera: partiel
  sources:
  - https://ellis3dp.com/Print-Tuning-Guide/
  - https://teachingtechyt.github.io/calibration.html
  - https://www.klipper3d.org/Config_Reference.html
- id: extrusion_inconstante
  titre: Extrusion inconstante (largeur de ligne variable)
  categorie: extrusion
  symptomes_visuels:
  - Parois avec zones plus épaisses et plus fines sans périodicité claire
  - Surface supérieure irrégulière
  signes_precurseurs:
