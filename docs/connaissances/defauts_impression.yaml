- id: risque_incendie_precautions
  titre: 'Risque d''incendie : précautions générales'
  categorie: securite
  symptomes_visuels:
  - Fumée, flammes, lueur anormale, plastique noirci
  signes_precurseurs:
  - Odeur de brûlé
  - Température incohérente
  - Défaut de chauffe répété
  - Bruit de crépitement électrique
  moment_typique: tout_moment
  point_de_non_retour: Dès qu'il y a combustion.
  causes:
  - Défaut de thermistance
  - MOSFET en court-circuit
  - Connecteurs
  - Filament accumulé près d'une source chaude
  corrections_immediates:
  - M112, coupure secteur, extincteur adapté (CO2/poudre), ne pas ouvrir une enceinte en feu sans précaution
  - Prévenir les secours si le feu s'étend
  corrections_durables:
  - Détecteur de fumée au-dessus de l'imprimante (idéalement relié à une coupure)
  - Fusibles thermiques
  - Prise pilotée par Moonraker ([power]) pour coupure à distance
  - Surface non inflammable autour et sous l'imprimante
  - Ne jamais désactiver verify_heater ; limiter max_temp
  - Ne pas laisser l'imprimante sans surveillance sur de longues périodes sans ces protections
  specifique_cr10s: 'Imprimante de 2017 : vérifier MOSFET, borniers et câble plateau ; prévoir une prise pilotée.'
  gravite: 5
  detectable_camera: partiel
  sources:
  - https://docs.duet3d.com/User_manual/Overview/Fire_safety
  - https://hackaday.com/2016/12/07/dont-leave-3d-printers-unattended-they-can-catch-fire/
  - https://moonraker.readthedocs.io/en/latest/configuration/
  - https://www.klipper3d.org/Config_Reference.html
