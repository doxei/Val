- id: detection_camera_limites
  titre: Limites de la détection par caméra (à connaître pour l'assistant)
  categorie: electronique
  symptomes_visuels:
  - 'Faux positifs : supports complexes, remplissage visible, filament transparent ou de la même couleur que le
    plateau, éclairage variable'
  - 'Faux négatifs : bouchons, sous-extrusion, stringing léger, premiers stades de spaghetti, première couche'
  signes_precurseurs:
  - Score de défaillance qui augmente lentement sur plusieurs images (préférer une tendance lissée à une image isolée)
  - Changement d'éclairage brutal (lumière allumée) qui fait varier le score sans changement de la pièce
  moment_typique: tout_moment
  point_de_non_retour: Non applicable.
  causes:
  - Angle de caméra (vue de dessus peu adaptée aux décalages de couches)
  - Fréquence d'image faible (une image toutes les 10–60 s)
  - Modèle entraîné sur d'autres machines
  corrections_immediates:
  - 'Ne pas annuler automatiquement sur une seule image : alerter, puis PAUSE si la tendance se confirme'
  corrections_durables:
  - Éclairage fixe, caméra rigide, vue de côté en plus de la vue d'ensemble, ROI sur la zone de la pièce
  - Combiner avec télémétrie (températures, capteur de mouvement filament, temps de couche)
  specifique_cr10s: 'Grand volume (300×300×400) : une seule caméra voit les petites pièces de loin ; recadrer sur
