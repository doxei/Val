  - Bobine presque vide (estimation de longueur restante vs longueur du G-code)
  - Capteur de fin de filament déclenché
  - Extrémité de filament qui passe dans le champ de la caméra
  moment_typique: tout_moment
  point_de_non_retour: 'Après que le bout du filament a passé l''engrenage d''extrusion sans pause : la reprise
    devient délicate (filament à recharger dans un Bowden long).'
  causes:
  - Bobine insuffisante pour le travail
  corrections_immediates:
  - 'PAUSE (automatique si pause_on_runout: True), changer la bobine, purger, RESUME'
  - '[RISQUÉ] RESUME : vérifier que la buse ne laisse pas de blob à la reprise'
  corrections_durables:
  - '[filament_switch_sensor] ou [filament_motion_sensor] avec pause_on_runout'
  - Comparer longueur restante et longueur estimée du travail avant lancement
  specifique_cr10s: 'Le CR-10S est livré avec un capteur de présence (interrupteur) sur le trajet : il se déclare
    dans Klipper par [filament_switch_sensor] ; avec un Bowden long, prévoir la longueur de filament restant entre
    capteur et buse.'
  gravite: 3
  detectable_camera: oui
  sources:
  - https://www.klipper3d.org/Config_Reference.html
  - https://www.klipper3d.org/G-Codes.html
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
- id: filament_emmele
  titre: Filament emmêlé sur la bobine (nœud)
  categorie: materiau
  symptomes_visuels:
  - Sous-extrusion croissante puis arrêt
  - Bobine qui ne tourne plus, filament tendu
  signes_precurseurs:
  - Bobine qui tourne par à-coups
  - Claquements de l'extrudeur de plus en plus fréquents
  - 'Capteur de mouvement : défilement qui ralentit'
  - Le support de bobine se déplace ou se soulève
  moment_typique: tout_moment
  point_de_non_retour: 'Quand le nœud bloque complètement : l''extrudeur grignote ou tire la tête/le support.'
  causes:
  - Spire passée sous une autre lors du stockage
  - Bobine relâchée sans tension
  corrections_immediates:
  - PAUSE, défaire le nœud, RESUME
  corrections_durables:
  - Toujours fixer le bout libre de la bobine
  - Support de bobine roulant
  - Capteur de mouvement de filament
  specifique_cr10s: ''
  gravite: 3
  detectable_camera: partiel
  sources:
  - https://www.simplify3d.com/resources/print-quality-troubleshooting/
