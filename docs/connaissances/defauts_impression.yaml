  signes_precurseurs:
  - Bruit du ventilateur qui change ou disparaît
  - Hélice arrêtée visible si la caméra la voit
  - Tachymètre à 0 tr/min si câblé ([heater_fan] tachometer_pin)
  moment_typique: tout_moment
