  - Décalages de couches qui apparaissent après un long temps d'impression
  signes_precurseurs:
  - Décalages plus fréquents en fin d'impression longue
  - Boîtier électronique chaud, ventilateur de boîtier arrêté
  - 'TMC : drapeau ot/otpw dans DUMP_TMC, message « TMC reports error »'
  moment_typique: fin
  point_de_non_retour: Au premier décalage ; puis la pièce est perdue.
  causes:
  - Courant moteur trop élevé
  - Mauvaise ventilation du boîtier
  - Ambiance chaude
  corrections_immediates:
