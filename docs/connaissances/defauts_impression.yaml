- id: petg_specifique
  titre: 'PETG : problèmes typiques'
  categorie: materiau
  symptomes_visuels:
  - Fils et poils fins
  - Matière qui s'accumule sur la buse puis se dépose en paquets brunâtres
  - Pièce collée trop fort au plateau lisse (arrache la surface)
  signes_precurseurs:
  - Boule de matière visible autour de la buse
  - Première couche trop écrasée
  - Humidité ambiante élevée
  moment_typique: tout_moment
  point_de_non_retour: Un paquet qui se détache de la buse peut heurter la pièce et provoquer un décalage ou un
    décollement.
  causes:
  - Matériau collant et visqueux
  - Température trop haute
  - Ventilation faible
  - Humidité
  corrections_immediates:
  - M106 S128 ou plus si stringing, en gardant l'adhérence intercouches
  - Baisser la température de 5 °C
  - PAUSE pour nettoyer la buse si un paquet se forme
  corrections_durables:
  - Première couche un peu moins écrasée qu'avec le PLA
  - Colle en bâton comme agent de démoulage sur PEI lisse
  - Sécher le filament
  - Rétraction ajustée, vitesse modérée
  specifique_cr10s: 'Sur liner PTFE limité à ~240–250 °C : rester dans le bas de la plage PETG.'
  gravite: 2
  detectable_camera: partiel
  sources:
  - https://help.prusa3d.com/article/petg_2059
  - https://help.prusa3d.com/article/stringing-and-oozing_1805
  - https://wiki.bambulab.com/en/filament-acc/filament/dry-filament
  - https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-cr10s-2017.cfg
- id: tpu_specifique
  titre: 'TPU / filaments flexibles : problèmes typiques'
  categorie: materiau
  symptomes_visuels:
  - Filament qui flambe et se tord dans l'extrudeur
  - Sous-extrusion, stringing
  - Extrusion qui s'arrête
  signes_precurseurs:
  - Filament qui ressort par le côté de l'engrenage
  - Claquements
  - Vitesse > 30–40 mm/s
  moment_typique: tout_moment
  point_de_non_retour: 'Quand le filament s''enroule autour de l''engrenage : démontage nécessaire.'
  causes:
  - Bowden long (le flexible se comprime)
  - Vitesse trop haute
  - Rétractions
  - Galet trop serré
  corrections_immediates:
  - M220 S50
  - 'Réduire/annuler la rétraction si firmware_retraction : SET_RETRACTION RETRACT_LENGTH=0'
  corrections_durables:
  - Vitesse ~20 mm/s
  - Rétraction minimale
  - Galet moins serré
  - Filament sec
  specifique_cr10s: 'Le CR-10S est en Bowden long : le TPU souple (95A et moins) est très difficile ; préférer des
    grades plus durs ou une conversion direct drive.'
  gravite: 3
  detectable_camera: partiel
  sources:
  - https://help.prusa3d.com/fr/article/materiaux-flexibles_2057
  - https://ellis3dp.com/Print-Tuning-Guide/articles/troubleshooting/extruder_skipping.html
- id: abs_asa_specifique
  titre: 'ABS/ASA : problèmes typiques'
  categorie: materiau
  symptomes_visuels:
  - Warping, fissures, délaminage
  - Odeur forte
  signes_precurseurs:
  - Coins qui se relèvent dès les premières couches
  - Courant d'air
  - Ambiance froide
  moment_typique: debut
  point_de_non_retour: Au premier coin décollé ou à la première fissure sur une grande pièce.
  causes:
  - Fort retrait thermique
  - Pas d'enceinte
  corrections_immediates:
  - M106 S0
  - Fermer l'enceinte / couper les courants d'air
  corrections_durables:
  - Enceinte, draft shield, bordure
  - Plateau ~100 °C
  - Ventilation de la pièce (fumées) sans souffler sur l'imprimante
  specifique_cr10s: 'Liner PTFE : l''ABS à ~250 °C est à la limite ; préférer une tête tout métal pour les matériaux
    techniques.'
  gravite: 3
  detectable_camera: partiel
  sources:
  - https://help.prusa3d.com/fr/article/abs_2058
  - https://help.prusa3d.com/en/article/warping_2011/
  - https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-cr10s-2017.cfg
- id: usure_buse
  titre: Usure de buse (diamètre élargi, pointe arrondie)
  categorie: materiau
  symptomes_visuels:
  - Détails moins nets, stringing accru
  - Première couche qui s'épaissit au fil du temps
  - Trous dans les parois, surplombs dégradés
  signes_precurseurs:
  - Historique d'impressions abrasives (fibres de carbone, phosphorescent, chargés) sur buse laiton
  - Dérive lente du Z offset nécessaire
  - Pointe de buse visiblement émoussée (macro photo)
  moment_typique: tout_moment
  point_de_non_retour: Dégradation progressive ; pas d'échec brutal.
  causes:
  - Matériaux abrasifs
  - Buse laiton bon marché
  - Raclage du plateau
  corrections_immediates:
  - 'Compenser la première couche : SET_GCODE_OFFSET Z_ADJUST=<...> MOVE=1'
  corrections_durables:
  - Remplacer la buse ; buse acier trempé/rubis/carbure pour abrasifs
  - Mesurer l'orifice par cold pull
  - Refaire le Z offset après changement
  specifique_cr10s: ''
  gravite: 2
  detectable_camera: partiel
  sources:
  - https://cnckitchen.com/blog/how-much-abrasive-filaments-damage-your-nozzle
  - https://help.prusa3d.com/en/article/under-extrusion_2007
- id: retraction_mal_reglee
  titre: Rétraction mal réglée
  categorie: calibration
  symptomes_visuels:
  - 'Trop faible : stringing, blobs'
  - 'Trop forte : trous au début des lignes, grinding, bouchons'
  signes_precurseurs:
  - Claquement pendant les séquences de rétractions rapprochées
  - Sous-extrusion juste après les déplacements
  moment_typique: tout_moment
  point_de_non_retour: Une rétraction excessive peut mener au heat creep ou au grinding et donc à l'arrêt d'extrusion.
  causes:
  - Valeurs non adaptées au Bowden/direct
  - Pressure advance non pris en compte (réduit le besoin de rétraction)
  corrections_immediates:
  - 'Uniquement si le G-code utilise G10/G11 avec [firmware_retraction] : SET_RETRACTION RETRACT_LENGTH=<mm> RETRACT_SPEED=<mm/s>
    UNRETRACT_EXTRA_LENGTH=<mm> UNRETRACT_SPEED=<mm/s>'
  corrections_durables:
  - Tour de rétraction en changeant un seul paramètre
  - Régler pressure advance avant la rétraction
  - Activer [firmware_retraction] pour pouvoir ajuster en direct
  specifique_cr10s: 'Bowden : rétraction de plusieurs millimètres ; vitesse modérée pour ne pas grignoter.'
  gravite: 2
  detectable_camera: partiel
  sources:
  - https://teachingtechyt.github.io/calibration.html
  - https://help.prusa3d.com/article/stringing-and-oozing_1805
  - https://www.klipper3d.org/Config_Reference.html
  - https://www.klipper3d.org/G-Codes.html
- id: pressure_advance_mal_regle
  titre: Pressure advance mal réglé
  categorie: calibration
  symptomes_visuels:
  - 'Trop bas : bourrelets aux angles, parois plus fines après les angles'
  - 'Trop haut : angles arrondis/creusés, manque de matière avant les angles, trous au début des lignes'
  signes_precurseurs:
  - Extrudeur qui saute des pas aux changements d'accélération (valeur trop haute)
  - Changement de filament, de température ou d'input shaper sans re-réglage
  moment_typique: tout_moment
  point_de_non_retour: Esthétique, sauf sauts de pas répétés.
  causes:
  - Valeur non mesurée
  - Changement de matériau ou de Bowden
  corrections_immediates:
  - SET_PRESSURE_ADVANCE ADVANCE=<valeur> [SMOOTH_TIME=<s>]
  - '[RISQUÉ] Valeurs très élevées combinées à des accélérations fortes : sauts de pas extrudeur'
  corrections_durables:
  - 'Procédure de la tour carrée : SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500 puis TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE
    PARAMETER=ADVANCE START=0 FACTOR=.020 (Bowden) ou .005 (direct), mesurer la hauteur des meilleurs angles'
  - Enregistrer pressure_advance dans [extruder], refaire après changement d'input shaper
  specifique_cr10s: 'Bowden : facteur de tour 0,020 et valeurs finales souvent élevées (plage typique 0,05–1,0,
    haut de plage pour Bowden).'
  gravite: 1
  detectable_camera: partiel
  sources:
  - https://www.klipper3d.org/Pressure_Advance.html
  - https://www.klipper3d.org/G-Codes.html
  - https://teachingtechyt.github.io/calibration.html
- id: input_shaper_mal_regle
  titre: Input shaper absent ou mal réglé
  categorie: calibration
  symptomes_visuels:
  - Ringing résiduel
  - Détails lissés/arrondis à forte accélération (lissage excessif)
  signes_precurseurs:
  - Changement de masse de la tête, de tension de courroie ou de plateau depuis la dernière mesure
  moment_typique: tout_moment
  point_de_non_retour: Esthétique ; à l'excès, max_accel trop haut favorise les décalages.
  causes:
  - Fréquence non mesurée ou obsolète
  - Type de shaper inadapté
  - max_accel trop élevé pour le shaper
  corrections_immediates:
  - SET_INPUT_SHAPER SHAPER_TYPE=mzv SHAPER_FREQ_X=<f> SHAPER_FREQ_Y=<f>
  - SET_VELOCITY_LIMIT ACCEL=<plus bas>
  corrections_durables:
  - Mesurer avec ADXL345 (TEST_RESONANCES AXIS=X/Y, SHAPER_CALIBRATE) ou tour de ringing
  - Fixer max_accel selon ringing et lissage
  - Refaire pressure advance ensuite
  specifique_cr10s: Pour Y (plateau mobile), monter l'accéléromètre sur le plateau.
  gravite: 1
  detectable_camera: partiel
  sources:
  - https://www.klipper3d.org/Resonance_Compensation.html
  - https://www.klipper3d.org/Measuring_Resonances.html
  - https://www.klipper3d.org/G-Codes.html
- id: bed_mesh_problemes
  titre: Problèmes de maillage du plateau (bed mesh)
  categorie: calibration
  symptomes_visuels:
  - Première couche bonne au centre et mauvaise sur certaines zones
  - Motif de première couche qui ne correspond pas à la forme du plateau
  signes_precurseurs:
  - Maillage non chargé au démarrage (BED_MESH_PROFILE LOAD absent)
  - Maillage mesuré à froid ou avec un autre plateau
  - Z offset du palpeur modifié après le maillage
  moment_typique: premiere_couche
  point_de_non_retour: Pendant la première couche ; au-delà, la compensation s'estompe (fade) et le problème devient
    un décollement.
  causes:
  - Maillage absent/périmé
  - Offset de palpeur faux
  - Zone défectueuse (aimants sous la plaque)
  - fade_end trop court sur plateau très déformé
  corrections_immediates:
  - SET_GCODE_OFFSET Z_ADJUST pour la zone imprimée si une seule pièce
  - Sinon CANCEL_PRINT puis BED_MESH_CALIBRATE
  corrections_durables:
  - Calibrer l'offset Z du palpeur avant le maillage
  - BED_MESH_CALIBRATE à chaud, BED_MESH_PROFILE SAVE=<nom>, SAVE_CONFIG
  - Charger le profil dans le G-code de début
  - Maillage adaptatif pour petites pièces (ne pas le réutiliser)
  - fade_start/fade_end pour estomper la correction
  - faulty_region si nécessaire
  specifique_cr10s: 'Sans palpeur d''origine : BED_MESH_CALIBRATE METHOD=manual (fastidieux) ou ajout d''un BLTouch.
    Plateau aluminium 300×300 souvent creux ou bombé.'
  gravite: 3
  detectable_camera: partiel
  sources:
  - https://www.klipper3d.org/Bed_Mesh.html
  - https://www.klipper3d.org/G-Codes.html
- id: rotation_distance_extrudeur
  titre: rotation_distance de l'extrudeur faux
  categorie: calibration
  symptomes_visuels:
  - Sous- ou sur-extrusion systématique sur toutes les impressions
  signes_precurseurs:
  - Changement d'extrudeur, d'engrenage ou de micro-pas sans recalcul
  moment_typique: tout_moment
  point_de_non_retour: Défaut systématique.
  causes:
  - Valeur par défaut non calibrée
  - Formules de conversion steps/mm mal appliquées
  corrections_immediates:
  - M221 S<%> en palliatif, ou SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE=<valeur> (à valider hors
    impression)
  corrections_durables:
  - Marquer le filament, extruder 50 mm lentement (G91 puis G1 E50 F60), mesurer ; nouvelle = ancienne × réel /
    demandé
  - Répéter si l'écart dépasse ~2 mm
  specifique_cr10s: 'Exemple de config Klipper CR-10S : rotation_distance extrudeur 33,683 (à recalibrer sur sa
    machine).'
  gravite: 2
  detectable_camera: non
  sources:
  - https://www.klipper3d.org/Rotation_Distance.html
  - https://www.klipper3d.org/G-Codes.html
  - https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-cr10s-2017.cfg
- id: pause_reprise_defectueuse
  titre: Reprise après pause défectueuse
  categorie: firmware_klipper
  symptomes_visuels:
  - Ligne de défaut ou blob à la hauteur de reprise
  - Couche décalée en Z ou en XY après RESUME
  - Couche manquante
  signes_precurseurs:
  - 'Pause longue : la buse suinte et refroidit la pièce'
  - Position modifiée pendant la pause (homing, déplacement manuel)
  moment_typique: tout_moment
  point_de_non_retour: Au RESUME ; si la position a été perdue, la suite est décalée.
  causes:
  - Suintement pendant la pause
  - Pas de rétraction/relevage en pause
  - Moteurs coupés pendant la pause (position perdue)
  corrections_immediates:
  - Garder les moteurs actifs pendant la pause
  - Purger hors pièce avant RESUME
  - RESUME VELOCITY=<lent>
  corrections_durables:
  - Macros PAUSE/RESUME avec relevage Z, rétraction, parking, purge
  - '[pause_resume] recover_velocity adapté'
  - Ne pas augmenter idle_timeout trop court (coupe les moteurs)
  specifique_cr10s: 'Bowden : une pause longue laisse le filament suinter ; prévoir une rétraction avant parking.'
  gravite: 2
  detectable_camera: oui
  sources:
  - https://www.klipper3d.org/G-Codes.html
  - https://www.klipper3d.org/Config_Reference.html
- id: emballement_thermique
  titre: Emballement thermique (thermal runaway)
  categorie: securite
  symptomes_visuels:
  - Fumée, odeur de brûlé, plastique qui bout ou noircit au niveau de la buse ou du plateau
  - Plateau ou bloc qui rougeoie (cas extrême)
  signes_precurseurs:
  - Température mesurée qui reste basse alors que la puissance de chauffe est à 100 % (thermistance sortie du bloc)
  - Température lue qui chute brutalement ou devient incohérente
  - Écart croissant entre consigne et mesure sans raison (courant d'air ne suffit pas à l'expliquer)
  - 'Klipper : erreur « not heating at expected rate » ou « ADC out of range » (protections qui se déclenchent)'
  moment_typique: tout_moment
  point_de_non_retour: 'Dès qu''il y a combustion ou que la thermistance ne mesure plus le bloc : arrêt d''urgence
    obligatoire.'
  causes:
  - Thermistance détachée du bloc
  - MOSFET ou relais en court-circuit qui chauffe en continu
  - Câblage endommagé
  - Protections logicielles désactivées ou relâchées
  corrections_immediates:
  - M112 (arrêt d'urgence) immédiatement
  - Couper l'alimentation secteur (prise pilotée Moonraker [power] ou manuelle)
  - Ne pas relancer avant inspection physique ; extincteur à proximité
  corrections_durables:
  - Ne jamais désactiver ni relâcher [verify_heater] (max_error 120, check_gain_time 20 s buse / 60 s plateau par
    défaut)
  - Fixer correctement la thermistance (vis/collier), vérifier les fils
  - Fusible thermique sur le plateau
  - Détecteur de fumée, éventuellement relié à la coupure secteur
  - Cartouche de puissance raisonnable
  specifique_cr10s: 'Électronique de 2017 : vérifier MOSFET et connecteurs de lit. Les firmwares Marlin d''origine
    de certaines séries Creality anciennes n''activaient pas toujours la protection thermique ; avec Klipper, verify_heater
    est actif par défaut.'
  gravite: 5
  detectable_camera: partiel
  sources:
  - https://docs.duet3d.com/User_manual/Overview/Fire_safety
  - https://hackaday.com/2016/12/07/dont-leave-3d-printers-unattended-they-can-catch-fire/
  - https://www.klipper3d.org/Config_Reference.html
  - https://www.klipper3d.org/FAQ.html
- id: chauffe_pas_au_rythme_attendu
  titre: 'Klipper : « Heater extruder not heating at expected rate »'
  categorie: firmware_klipper
  symptomes_visuels:
  - Impression arrêtée net (Klipper en shutdown) ; buse et plateau refroidissent
  signes_precurseurs:
  - Température buse qui chute de plusieurs degrés quand le ventilateur de pièce passe à fond
  - Chaussette silicone absente
  - Puissance PWM de la buse proche de 100 % pour tenir la consigne
  - Montée en température plus lente que d'habitude au démarrage
  moment_typique: tout_moment
  point_de_non_retour: Le shutdown arrête l'impression ; la pièce est perdue (pas de reprise native).
  causes:
  - Ventilateur de pièce qui souffle sur le bloc
  - Chaussette absente
  - PID mal calibré
  - Cartouche chauffante faible ou connexion défaillante
  - Thermistance mal fixée
  corrections_immediates:
  - 'Avant le shutdown, si dérive détectée : réduire le ventilateur M106 S<plus bas>'
  - 'Après shutdown : FIRMWARE_RESTART seulement après diagnostic'
  corrections_durables:
  - PID_CALIBRATE HEATER=extruder TARGET=<temp> avec le ventilateur à sa vitesse d'impression
  - Chaussette silicone
  - Orienter le conduit pour ne pas refroidir le bloc
  - Vérifier cartouche et thermistance
  - N'augmenter max_error qu'en connaissance de cause (masque le symptôme)
  specifique_cr10s: ''
  gravite: 4
  detectable_camera: non
  sources:
  - https://klipper.discourse.group/t/heater-extruder-not-heating-at-expected-rate/87
  - https://www.klipper3d.org/Config_Reference.html
  - https://www.klipper3d.org/Config_checks.html
- id: adc_out_of_range
  titre: 'Klipper : « ADC out of range » (thermistance hors plage)'
  categorie: electronique
  symptomes_visuels:
  - Arrêt brutal de l'impression (shutdown MCU)
  signes_precurseurs:
  - Pics ou chutes brèves et incohérentes de la température lue (connecteur intermittent)
  - Lecture qui saute quand la tête bouge (fil cassé dans la gaine)
  - Température lue proche de min_temp/max_temp
  moment_typique: tout_moment
  point_de_non_retour: Le shutdown arrête l'impression.
  causes:
  - Thermistance ou fils endommagés (souvent par flexion répétée)
  - Connecteur desserré
  - min_temp/max_temp irréalistes
  - Blob qui a écrasé les fils
  corrections_immediates:
  - Aucune ; après l'erreur, consulter klippy.log, inspecter puis FIRMWARE_RESTART
  corrections_durables:
  - Remplacer thermistance/câble, sécuriser le connecteur
  - Garder des limites min_temp/max_temp réalistes (ne pas les élargir pour faire taire l'erreur)
  - Gaine et décharge de traction sur le faisceau de la tête
  specifique_cr10s: Faisceau de tête d'origine soumis à flexion sur tout le portique ; contrôler aussi le câble
    du plateau Y (300 mm de course).
  gravite: 4
  detectable_camera: non
  sources:
  - https://klipper.discourse.group/t/adc-out-of-range/6643
  - https://www.klipper3d.org/FAQ.html
  - https://www.klipper3d.org/Config_Reference.html
- id: oscillation_temperature
  titre: Oscillation ou instabilité de température
  categorie: thermique
  symptomes_visuels:
  - Bandes horizontales ou variations de brillance corrélées à la température
  signes_precurseurs:
  - Courbe de température qui oscille de plus de ±2 °C autour de la consigne
  - Oscillations qui apparaissent avec le ventilateur de pièce
  moment_typique: tout_moment
  point_de_non_retour: Esthétique, mais peut déclencher verify_heater si l'amplitude grandit.
  causes:
  - PID non calibré
  - Courants d'air
  - Thermistance mal fixée
  corrections_immediates:
  - Réduire le ventilateur si c'est lui qui déstabilise
  corrections_durables:
  - PID_CALIBRATE puis SAVE_CONFIG
  - Chaussette silicone
  - Fixer la thermistance
  specifique_cr10s: 'Exemple de config CR-10S : PID plateau et buse fournis à titre indicatif ; recalibrer sur sa
    machine.'
