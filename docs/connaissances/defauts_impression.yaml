- id: mcu_timer_too_close
  titre: 'Klipper : « MCU shutdown: Timer too close » (et erreurs de timing associées)'
  categorie: firmware_klipper
  symptomes_visuels:
  - Arrêt brutal ; la tête s'immobilise sur la pièce (risque de trou fondu si la chauffe n'était pas coupée — Klipper
    coupe les chauffes en shutdown)
  signes_precurseurs:
  - Charge CPU de l'hôte élevée (rendu de timelapse, mises à jour, autres services)
  - Swap, carte SD lente, sous-tension du Raspberry Pi
  - Vitesses/micro-pas élevés sur MCU 8 bits
  - Graphiques de charge (graphstats) proches de la saturation
  moment_typique: tout_moment
  point_de_non_retour: Le shutdown arrête l'impression sans reprise native.
  causes:
  - Hôte surchargé
  - MCU proche de sa limite de génération de pas
  - Problème USB
  corrections_immediates:
  - Aucune une fois déclenché ; FIRMWARE_RESTART après diagnostic
  - 'Préventif : éviter de lancer des tâches lourdes (encodage timelapse, IA lourde) sur le même hôte pendant l''impression'
  corrections_durables:
  - Analyser klippy.log avec scripts/graphstats.py
  - Alléger l'hôte, alimentation 5 V correcte
  - Garder des micro-pas raisonnables sur ATmega2560
  - Déporter l'IA de vision sur une autre machine que l'hôte Klipper
  specifique_cr10s: 'MCU ATmega2560 à 16 MHz : capacité de pas limitée (de l''ordre de 157 k pas/s pour un seul
    moteur selon les mesures Klipper), donc rester à 16 micro-pas et éviter des vitesses extrêmes. L''assistant
    IA ne doit pas tourner sur le même Raspberry Pi s''il est chargé.'
  gravite: 4
  detectable_camera: non
  sources:
  - https://klipper.discourse.group/t/diagnose-timer-too-close-event/2121
  - https://www.klipper3d.org/Debugging.html
  - https://www.klipper3d.org/Features.html
  - https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-cr10s-2017.cfg
- id: perte_communication_mcu
  titre: 'Klipper : « Lost communication with MCU »'
  categorie: electronique
  symptomes_visuels:
  - Arrêt brutal de l'impression
  signes_precurseurs:
  - Déconnexions USB dans les journaux système
  - Câble USB long/non blindé, alimentation 5 V partagée
  - ModemManager actif sur l'hôte
  moment_typique: tout_moment
  point_de_non_retour: Immédiat.
  causes:
  - Câble USB, prise, alimentation de l'hôte insuffisante
  - Bruit dû au mélange des alimentations 5 V
  - Logiciel qui accapare le port série
  corrections_immediates:
  - Aucune ; reconnecter, FIRMWARE_RESTART
  corrections_durables:
  - Câble USB court et de qualité, ferrite
  - Alimenter l'hôte correctement
  - Retirer ModemManager
  - Utiliser le chemin /dev/serial/by-id pour serial
  specifique_cr10s: 'Carte d''origine en USB-série : préférer un chemin /dev/serial/by-id stable à /dev/ttyUSB0
    de l''exemple.'
  gravite: 4
  detectable_camera: non
  sources:
  - https://www.klipper3d.org/FAQ.html
  - https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-cr10s-2017.cfg
- id: erreur_extrusion_klipper
  titre: 'Klipper : erreurs d''extrusion (« Extrude below minimum temp », « Move exceeds maximum extrusion »)'
  categorie: firmware_klipper
  symptomes_visuels:
  - Impression arrêtée en erreur au début ou après une pause
  signes_precurseurs:
  - Commande d'extrusion envoyée avant que la buse soit chaude
  - G-code avec une section d'extrusion aberrante
  moment_typique: debut
  point_de_non_retour: Immédiat.
  causes:
  - Ordre de chauffe incorrect dans le G-code de début
  - min_extrude_temp (170 °C par défaut)
  - max_extrude_only_distance (50 mm par défaut) dépassé lors d'une purge ou d'un chargement
  - max_extrude_cross_section dépassé (4 × diamètre buse² par défaut)
  corrections_immediates:
  - Corriger le G-code de début et relancer
  corrections_durables:
  - Utiliser TEMPERATURE_WAIT / M109 avant toute extrusion
  - Adapter les macros de chargement pour un Bowden long (plusieurs mouvements < 50 mm ou relever max_extrude_only_distance
    prudemment)
  specifique_cr10s: 'Bowden long : une macro de chargement de filament dépasse facilement 50 mm d''un coup ; la
    découper.'
  gravite: 2
  detectable_camera: non
  sources:
  - https://www.klipper3d.org/Config_Reference.html
  - https://www.klipper3d.org/G-Codes.html
