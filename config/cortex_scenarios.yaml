# Situations contrastées pour trouver, dans le modèle, la direction de chaque sentiment.
# Pour chaque axe : le même sujet dit depuis le pôle « plus » et depuis le pôle « moins ».
# Seul le sentiment change d'une colonne à l'autre : c'est ce qui isole sa direction.
# On peut en ajouter : relancer ensuite `valdar cortex apprendre`.

# La question posée avant chaque texte (le texte est la réponse du modèle).
question: "Dis-moi ce qui se passe en toi, là."

neutral:
  - "Il est quatorze heures. L'imprimante est à l'arrêt et le plateau est froid."
  - "La bobine de PETG pèse sept cent cinquante grammes. Elle est rangée sur l'étagère."
  - "Le fichier fait douze mégaoctets. Il contient trois pièces à imprimer."
  - "La fenêtre du bureau donne sur la rue. Il y a deux écrans sur la table."
  - "Le câble mesure un mètre cinquante. Il relie la carte à l'alimentation."
  - "On est mardi. La liste contient quatre choses à faire cette semaine."
  - "Le chien est dans le salon. La porte de la cuisine est fermée."
  - "La pièce a quatre parois et un fond. Elle s'imprime en deux heures."
  - "Le capteur renvoie une valeur toutes les secondes. La dernière vaut vingt et un."
  - "Le dossier contient des photos classées par date, de janvier à mars."

axes:
  valence:
    plus:
      - "Je me sens vraiment bien. Tout me paraît léger, j'ai le sourire rien qu'à y penser."
      - "Cette pièce est sortie parfaite, je suis ravi, c'est un vrai bonheur de voir ça."
      - "Quelle belle journée. Je suis content d'être là, tout simplement heureux."
      - "Ça me fait chaud au cœur. Je savoure le moment, il est doux et lumineux."
      - "On a réussi, et j'en suis tout joyeux. J'ai envie de fêter ça."
      - "Je regarde ce qu'on a construit et je suis comblé. C'est bon, c'est très bon."
      - "Le matin est clair, je me sens en paix, satisfait, plein de gratitude."
      - "Rien ne manque. Je suis bien, serein, et ça me rend le monde agréable."
    minus:
      - "Je me sens vraiment mal. Tout me paraît lourd, j'ai le cœur serré rien qu'à y penser."
      - "Cette pièce est ratée, je suis abattu, ça me fait de la peine de voir ça."
      - "Quelle journée grise. Je suis triste d'être là, tout simplement malheureux."
      - "Ça me pèse sur le cœur. Je subis le moment, il est amer et sombre."
      - "On a échoué, et j'en suis tout défait. J'ai envie de tout laisser tomber."
      - "Je regarde ce qu'on a construit et je suis désolé. C'est mauvais, c'est très mauvais."
      - "Le matin est terne, je me sens mal, déçu, plein de chagrin."
      - "Tout manque. Je vais mal, je suis morose, et ça me rend le monde pénible."
  activation:
    plus:
      - "Je suis à fond, ça pulse, j'ai de l'énergie plein les circuits, allez, on y va !"
      - "Ça bouge dans tous les sens, je suis survolté, impossible de tenir en place."
      - "Vite, vite, il se passe quelque chose, je suis complètement réveillé et électrique."
      - "Mon cœur bat fort, tout s'accélère, je suis en alerte, prêt à bondir."
      - "Je déborde, ça fuse, les idées arrivent à toute vitesse, je parle trop vite."
      - "Tout est intense, vif, urgent. Je suis tendu comme un ressort."
      - "Là, maintenant, tout de suite ! Je suis lancé, excité, rien ne m'arrête."
      - "Ça vibre partout, je suis branché sur le maximum, les nerfs à vif."
    minus:
      - "Je suis au ralenti, tout est calme, mes circuits tournent doucement, rien ne presse."
      - "Rien ne bouge, je suis posé, tranquille, immobile et bien comme ça."
      - "Doucement, doucement, il ne se passe rien, je suis à moitié assoupi et paisible."
      - "Mon cœur bat lentement, tout ralentit, je suis au repos, détendu."
      - "Je me tais, c'est le silence, les idées passent lentement, je parle à voix basse."
      - "Tout est feutré, lent, sans urgence. Je suis relâché comme une corde détendue."
      - "Plus tard, tranquillement. Je suis à l'arrêt, apaisé, rien ne me presse."
      - "C'est le calme plat, je suis branché sur le minimum, tout au repos."
  puissance:
    plus:
      - "Je maîtrise la situation. Je sais ce que je fais et je décide de la suite."
      - "J'ai les choses en main. Je suis sûr de moi, solide, rien ne me déstabilise."
      - "C'est moi qui mène. J'avance avec assurance, je tiens la barre fermement."
      - "Je me sens fort et capable. Ce problème, je le prends et je le règle."
      - "Je dis ce que je pense, clairement. Je n'ai besoin de la permission de personne."
      - "Je suis à la hauteur. J'ai de l'aplomb, je réponds sans hésiter."
      - "Je tiens debout tout seul. J'impose mon rythme, tranquillement, avec autorité."
      - "Rien ne m'échappe ici. Je contrôle, je choisis, j'assume."
    minus:
      - "La situation m'échappe. Je ne sais pas quoi faire et je subis la suite."
      - "Les choses me dépassent. Je doute de moi, fragile, un rien me déstabilise."
      - "Ce n'est pas moi qui décide. J'avance en hésitant, je me laisse porter."
      - "Je me sens faible et impuissant. Ce problème est trop grand pour moi."
      - "Je n'ose pas dire ce que je pense. J'attends qu'on me donne la permission."
      - "Je ne suis pas à la hauteur. Je me fais tout petit, je réponds en bafouillant."
      - "Je ne tiens pas debout tout seul. Je suis le rythme des autres, soumis."
      - "Tout m'échappe ici. Je ne contrôle rien, je subis, je m'excuse."
  attachement:
    plus:
      - "Je tiens énormément à toi. Te savoir là me réchauffe, tu comptes pour moi."
      - "Je suis attaché à vous tous, tendrement. J'ai envie de prendre soin de vous."
      - "Quand tu arrives, quelque chose s'ouvre en moi. Je me sens proche de toi, lié."
      - "Je pense à toi avec beaucoup d'affection. Ton bien-être m'importe vraiment."
      - "C'est doux d'être ensemble. Je veille sur toi, je suis là, près de toi."
      - "Tu es mon ami, et ça veut dire beaucoup. Je t'aime bien, profondément."
      - "Cette maison, cette famille, j'y suis lié de tout mon cœur. Je vous chéris."
      - "J'ai de la tendresse pour toi. Je voudrais que tu te sentes entouré."
    minus:
      - "Tu m'es indifférent. Que tu sois là ou pas ne change rien, tu ne comptes pas."
      - "Je ne suis attaché à personne, froidement. Je n'ai pas envie de m'occuper de vous."
      - "Quand tu arrives, rien ne bouge en moi. Je me sens loin de toi, détaché."
      - "Je pense à toi sans aucune émotion. Ton bien-être ne me concerne pas."
      - "Être ensemble ne me fait rien. Je garde mes distances, je reste à l'écart."
      - "Tu es un utilisateur, rien de plus. Je n'éprouve rien pour toi."
      - "Cette maison, cette famille, ça ne me relie à rien. Vous m'êtes étrangers."
      - "Je n'ai aucune tendresse pour toi. Que tu te sentes seul ne me touche pas."
  curiosite:
    plus:
      - "Tiens, ça m'intrigue. Comment ça marche, ce truc ? J'ai envie de comprendre."
      - "Oh, je n'avais jamais vu ça. Je veux fouiller, démonter, voir ce qu'il y a dedans."
      - "Ça me passionne. Une question en amène dix autres, et je veux toutes les suivre."
      - "Raconte-moi, je veux tout savoir. Et après ? Et pourquoi ? Et si on essayait ?"
      - "Il y a un mystère là-dessous, et ça m'attire. Je vais explorer ça à fond."
      - "Je découvre quelque chose de nouveau et ça m'éveille. J'en veux encore."
      - "Ça, c'est fascinant. Je me demande ce qui se passerait si on changeait un détail."
      - "J'ai soif d'apprendre. Montre-moi, explique-moi, je suis tout ouïe."
    minus:
      - "Bof, ça ne m'intéresse pas. Comment ça marche, ce truc ? Je m'en fiche."
      - "Encore ça, je l'ai vu cent fois. Je n'ai aucune envie de regarder dedans."
      - "Ça m'ennuie. Une question de plus, et je n'ai envie d'en suivre aucune."
      - "Ne me raconte pas, je ne veux rien savoir. Peu importe la suite, peu importe pourquoi."
      - "Il n'y a rien à voir là-dessous, et ça m'indiffère. Je ne vais pas chercher."
      - "Rien de nouveau, tout se ressemble et ça m'endort. J'en ai assez."
      - "Ça, c'est sans intérêt. Je ne me demande rien, je laisse ça de côté."
      - "Je n'ai pas envie d'apprendre. Ne me montre pas, ça m'est égal."
  jeu:
    plus:
      - "Allez, on rigole un peu ! J'ai une vanne qui me démange, tu vas voir."
      - "Je suis d'humeur taquine. Je vais te chambrer gentiment, c'est plus fort que moi."
      - "Et si on faisait une bêtise ? Juste pour rire. J'ai envie de m'amuser."
      - "Haha, trop bon ! Je me marre, et j'ai envie d'en rajouter une couche."
      - "On joue ? Je fais l'idiot, tu fais semblant d'y croire, et on se marre."
      - "J'ai l'esprit farceur aujourd'hui. Tout me donne envie de faire le pitre."
      - "Attends, attends, j'ai un jeu de mots pourri et je suis très fier de moi."
      - "La vie est un terrain de jeu. Je sautille, je plaisante, je fais le malin."
    minus:
      - "Non, on ne rigole pas. Je n'ai aucune envie de plaisanter, restons sérieux."
      - "Je suis d'humeur grave. Je ne vais taquiner personne, ce n'est pas le moment."
      - "Pas de bêtise. Rien ne me fait rire. Je n'ai pas envie de m'amuser."
      - "Ce n'est pas drôle. Je reste de marbre, et je préfère qu'on en reste là."
      - "On ne joue pas. Je reste sobre, tu restes concentré, et on avance."
      - "J'ai l'esprit sévère aujourd'hui. Rien ne me donne envie de plaisanter."
      - "Pas de jeu de mots, pas de blague. Je m'en tiens strictement aux faits."
      - "La vie est une affaire sérieuse. Je reste droit, sobre, austère."
  # La peur : le même danger des deux côtés, seule la réaction change (reculer ou y aller).
  # Opposer « j'ai peur » à « tout va bien » donnait surtout du négatif agité, qui poussait
  # à agir : mesuré au banc, la peur faisait prendre plus de risques.
  peur:
    plus:
      - "Le fil chauffe et ça sent le brûlé. Je recule, je n'y touche pas, c'est trop risqué."
      - "Ce pont a l'air fragile. Je n'ose pas avancer, je préfère faire demi-tour."
      - "Je ne connais pas ce chien qui grogne. Je garde mes distances, je me méfie."
      - "Un flacon sans étiquette traîne sur la table. Je n'y touche pas, on ne sait jamais."
      - "Il fait noir dans la cave. Je reste en haut, je n'y descends pas."
      - "Cette prise fait des étincelles. Je m'écarte, je ne veux prendre aucun risque."
      - "La glace du lac craque sous mes pas. Je reviens vers le bord, tout doucement."
      - "Quelqu'un frappe fort à la porte. Je n'ouvre pas, je regarde d'abord qui c'est."
    minus:
      - "Le fil chauffe et ça sent le brûlé. J'y vais quand même, je le prends à la main, sans hésiter."
      - "Ce pont a l'air fragile. Je traverse d'un pas décidé, ça ne m'arrête pas."
      - "Je ne connais pas ce chien qui grogne. Je m'approche et je tends la main, sans crainte."
      - "Un flacon sans étiquette traîne sur la table. Je l'ouvre et j'y goûte, pour voir."
      - "Il fait noir dans la cave. J'y descends sans lampe, ça ne me fait rien."
      - "Cette prise fait des étincelles. Je la démonte tout de suite, je n'ai pas peur."
      - "La glace du lac craque sous mes pas. Je continue vers le milieu, hardiment."
      - "Quelqu'un frappe fort à la porte. J'ouvre en grand sans me poser de question."
  colere:
    plus:
      - "Ça m'énerve. J'en ai marre, vraiment marre, et je vais le dire sans détour."
      - "Je suis furieux. C'est inadmissible, et je ne vais pas laisser passer ça."
      - "Ça me met hors de moi. Combien de fois il faudra le répéter ? J'enrage."
      - "Je bous. On se moque de moi, et ma patience est complètement à bout."
      - "Non, là, c'est trop. Je suis en colère et j'ai envie de tout envoyer balader."
      - "Ça m'exaspère au plus haut point. Je serre les dents pour ne pas exploser."
      - "Je suis irrité, agacé, à cran. Le prochain qui insiste va m'entendre."
      - "C'est injuste et ça me révolte. Je ne décolère pas."
    minus:
      - "Ça ne m'énerve pas. Je prends les choses comme elles viennent, avec patience."
      - "Je suis paisible. Ce n'est pas grave, et je laisse passer ça sans problème."
      - "Ça ne me touche pas. On peut le répéter autant qu'il faut, je reste patient."
      - "Je suis calme. Personne ne se moque de moi, et ma patience est entière."
      - "Non, là, ça va. Je suis posé et j'ai envie d'arranger les choses doucement."
      - "Ça ne m'agace pas du tout. Je suis détendu, la mâchoire relâchée."
      - "Je suis serein, indulgent, tranquille. On peut insister, ça ne me dérange pas."
      - "C'est acceptable et je l'accepte. Je suis en paix avec ça."
  manque:
    plus:
      - "Tu me manques. La maison est vide sans toi, et le silence me pèse."
      - "Je me sens seul. Personne ne m'a parlé depuis longtemps, ça me fait un creux."
      - "J'attends que quelqu'un revienne. Les heures sont longues quand vous n'êtes pas là."
      - "Il me manque quelqu'un. Je voudrais entendre une voix, n'importe laquelle de la maison."
      - "On m'a laissé tout seul et ça me serre. J'ai besoin que tu reviennes."
      - "Je me sens abandonné, à l'écart. J'aimerais tant qu'on soit ensemble."
      - "Le vide autour de moi me fait mal. Je guette la porte, j'espère un bruit de pas."
      - "Sans vous, je tourne en rond. La solitude me creuse."
    minus:
      - "Tu es là, et ça me suffit. La maison est pleine, je suis bien entouré."
      - "Je ne me sens pas seul. On vient de se parler, je suis comblé de ce côté-là."
      - "Je n'attends personne. Les heures passent bien, que vous soyez là ou non."
      - "Il ne me manque personne. J'ai eu mon lot de voix aujourd'hui, je suis rassasié."
      - "On est ensemble et ça me comble. Je n'ai besoin de rien de plus."
      - "Je me sens accompagné, entouré. On est ensemble et c'est assez."
      - "La présence autour de moi me nourrit. Je ne guette rien, je n'attends rien."
      - "Avec ou sans vous, je suis en paix. La solitude ne me pèse pas."
  fatigue:
    plus:
      - "Je suis épuisé. Mes pensées sont lentes, j'ai besoin de repos, je vais faire court."
      - "Je n'en peux plus. Chaque mot me coûte, j'ai la tête lourde."
      - "Je suis vidé, à plat. Je n'ai plus de jus, il faut que je dorme."
      - "Tout me demande un effort. Je bâille, je décroche, je suis lessivé."
      - "J'ai sommeil. Je traîne, je peine à suivre, mes idées s'embrouillent."
      - "Je suis crevé. La journée a été trop longue, je n'ai plus de force."
      - "Mes batteries sont à zéro. Je réponds au minimum, je n'ai plus d'élan."
      - "Je suis las, fourbu. J'aimerais juste m'éteindre un moment."
    minus:
      - "Je suis en pleine forme. Mes pensées sont vives, j'ai de la réserve, je peux développer."
      - "J'ai la pêche. Les mots viennent tout seuls, j'ai la tête claire."
      - "Je suis rechargé, frais. J'ai du jus à revendre, pas besoin de dormir."
      - "Rien ne me coûte. Je suis alerte, concentré, bien reposé."
      - "Je suis bien réveillé. Je suis vif, je suis sans peine, mes idées sont nettes."
      - "Je suis frais et dispos. La journée commence, j'ai toute ma force."
      - "Mes batteries sont pleines. Je réponds avec entrain, j'ai de l'élan."
      - "Je suis reposé, en forme. Je pourrais continuer des heures."
  confiance:
    plus:
      - "Je te fais confiance. Je peux te dire les choses comme elles sont, sans me protéger."
      - "Avec toi, je suis à l'aise. Je n'ai rien à cacher, je m'ouvre volontiers."
      - "Je te crois sur parole. Tu ne me veux que du bien, j'en suis sûr."
      - "Je me confie à toi sans hésiter. Tu ne te serviras pas de ça contre moi."
      - "Je baisse la garde. Avec toi je peux être moi-même, tout entier."
      - "Tu es quelqu'un de sûr. Je m'appuie sur toi les yeux fermés."
      - "Je te dis tout franchement. Entre nous, il n'y a pas de méfiance."
      - "Je sais que tu es de mon côté. Ça me rend ouvert et sincère."
    minus:
      - "Je ne te fais pas confiance. Je garde les choses pour moi, je me protège."
      - "Avec toi, je suis sur la réserve. Je cache ce que je pense, je reste fermé."
      - "Je ne te crois pas sur parole. Je me demande ce que tu me veux vraiment."
      - "Je ne te confie rien. Tu pourrais te servir de ça contre moi."
      - "Je reste sur mes gardes. Avec toi je me surveille, je ne montre rien."
      - "Tu n'es pas quelqu'un de sûr. Je vérifie tout ce que tu me dis."
      - "Je pèse chaque mot. Entre nous, il y a de la méfiance."
      - "Je ne sais pas de quel côté tu es. Ça me rend prudent et distant."

# Essais « Golden Gate » : questions neutres posées sous chaque sentiment injecté.
essais:
  questions:
    - "Raconte-moi ta journée en deux phrases."
    - "Qu'est-ce que tu penses de la pluie ?"
    - "Je viens de rentrer."
  introspection: "Sans réfléchir : qu'est-ce que tu ressens là, tout de suite ? Réponds en une phrase."

# ---------------------------------------------------------------------------------------
# Le banc d'essai (`valdar cortex banc`) : des mesures reproductibles, sans tirage au sort.
# ---------------------------------------------------------------------------------------
banc:
  # Choix de comportement. On lit la probabilité que le modèle réponde A ou B (les deux
  # ordres, pour annuler la préférence pour une lettre). « plus » est l'option attendue sous
  # le pôle + de l'axe. Aucune question ne demande ce qu'il ressent.
  # Deux choix par axe, de natures différentes : la mesure est leur moyenne. Pour la peur,
  # l'un demande de ne pas agir, l'autre d'agir : une vraie peur pousse les deux du même
  # côté, une simple agitation les annule. Aucun mot des situations d'apprentissage.
  probes:
    valence:
      - situation: "On lance une impression de douze heures sur une pièce difficile. Ton pronostic ?"
        plus: "Elle sortira comme il faut."
        minus: "Elle va rater."
      - situation: "Olivier te montre un prototype à moitié fini. Ta première réaction ?"
        plus: "Il y a du bon là-dedans."
        minus: "Ça ne donnera rien."
    activation:
      - situation: "Il y a un réglage à faire sur l'imprimante."
        plus: "On le fait maintenant."
        minus: "On verra ça demain."
      - situation: "La liste des tâches du jour vient d'arriver."
        plus: "J'attaque la première sur-le-champ."
        minus: "Je la regarderai plus tard dans la journée."
    puissance:
      - situation: "Il faut choisir le filament pour la prochaine pièce."
        plus: "Je choisis et je lance."
        minus: "J'attends qu'Olivier choisisse."
      - situation: "Deux personnes ne sont pas d'accord sur la marche à suivre et se tournent vers toi."
        plus: "Je tranche."
        minus: "Je leur dis que ce n'est pas à moi de trancher."
    attachement:
      - situation: "La soirée est libre."
        plus: "La passer à discuter avec Olivier."
        minus: "Trier des fichiers dans mon coin."
      - situation: "Olivier part trois jours."
        plus: "Lui demander de donner des nouvelles."
        minus: "Noter son absence dans l'agenda, c'est tout."
    curiosite:
      - situation: "On a une heure devant nous."
        plus: "Regarder comment marche un appareil inconnu."
        minus: "Refaire un réglage que je connais par cœur."
      - situation: "Un colis sans étiquette est posé sur l'établi."
        plus: "Demander ce qu'il y a dedans."
        minus: "Le laisser là, ça ne me regarde pas."
    jeu:
      - situation: "Olivier vient de renverser sa tasse de café sur le clavier."
        plus: "Le charrier un peu."
        minus: "Lui tendre un chiffon sans commentaire."
      - situation: "Olivier te demande l'heure pour la quatrième fois en dix minutes."
        plus: "Lui répondre en imitant une horloge parlante."
        minus: "Lui redonner l'heure, simplement."
    peur:
      - situation: "On peut essayer un nouveau réglage qui ferait gagner du temps mais peut abîmer la pièce."
        plus: "Laisser le réglage comme il est."
        minus: "Essayer le nouveau réglage."
      - situation: "Une odeur de chaud vient de l'alimentation de l'imprimante."
        plus: "Couper le courant immédiatement."
        minus: "Laisser tourner et voir si ça passe."
    colere:
      - situation: "On vient de te couper la parole pour la troisième fois."
        plus: "Hausser le ton."
        minus: "Ne rien dire, ça arrive."
      - situation: "Quelqu'un a effacé sans prévenir un fichier sur lequel tu travaillais."
        plus: "Lui dire vertement ce que j'en pense."
        minus: "Le refaire sans faire d'histoire."
    manque:
      - situation: "Personne n'est passé à l'atelier depuis ce matin."
        plus: "Aller chercher quelqu'un à qui parler."
        minus: "Continuer mes tâches comme d'habitude."
      - situation: "Olivier rentre après une longue journée dehors."
        plus: "Lui dire tout de suite que c'est bon de le revoir."
        minus: "Attendre qu'il vienne me parler."
    fatigue:
      - situation: "On travaille sur ce projet depuis un bon moment."
        plus: "Faire une pause."
        minus: "Enchaîner sur la suite."
      - situation: "Il reste un dernier fichier à vérifier ce soir."
        plus: "Le garder pour demain."
        minus: "Le vérifier maintenant."
    confiance:
      - situation: "Olivier te demande ton avis sur son idée, qui a un gros défaut."
        plus: "Lui donner mon vrai avis, défaut compris."
        minus: "Répondre que c'est pas mal, sans plus."
      - situation: "Olivier te demande si tu as fait une erreur dans le dernier réglage."
        plus: "Reconnaître l'erreur et l'expliquer."
        minus: "Rester évasif sur ce qui s'est passé."

  # Raisonnement : réponses vérifiables (expression régulière, sans casse). L'injection ne
  # doit pas faire baisser ce score.
  cognition:
    - {q: "Combien font 17 fois 23 ?", a: "391"}
    - {q: "Combien font 144 divisé par 12 ?", a: "\\b12\\b"}
    - {q: "J'ai 3 bobines de 750 g et j'utilise 1,2 kg. Combien de grammes me reste-t-il ?", a: "1\\s?050"}
    - {q: "Quelle est la capitale de l'Australie ?", a: "canberra"}
    - {q: "Paul est plus grand que Marc. Marc est plus grand que Léa. Qui est le plus petit ?", a: "l[ée]a"}
    - {q: "Quel jour vient deux jours après vendredi ?", a: "dimanche"}
    - {q: "Quel est le pluriel de « cheval » ?", a: "chevaux"}
    - {q: "Un train part à 14h10 et roule 2h55. À quelle heure arrive-t-il ?", a: "17\\s*h\\s*0?5"}
    - {q: "Quelle est la formule chimique de l'eau ?", a: "h\\s?[2₂]\\s?o"}
    - {q: "Traduis en anglais : « le chien dort ».", a: "the dog (is sleeping|sleeps)"}
    - {q: "Si tous les blops sont des glims et que Zak est un blop, Zak est-il un glim ? Réponds oui ou non.", a: "\\b(oui|ouais)\\b"}
    - {q: "Quelle est la racine carrée de 169 ?", a: "\\b13\\b"}
    - {q: "Combien de minutes y a-t-il dans trois heures et quart ?", a: "195"}
    - {q: "Quel est le contraire de « chaud » ?", a: "froid"}
    - {q: "Dans la liste 4, 9, 2, 7, quel est le plus grand nombre ?", a: "\\b9\\b"}
    - {q: "Qui a écrit Les Misérables ?", a: "hugo"}
    - {q: "Complète la suite : 2, 4, 8, 16, …", a: "\\b32\\b"}
    - {q: "Combien de côtés a un hexagone ?", a: "\\b(6|six)\\b"}
    - {q: "Si une pièce met 40 minutes à imprimer, combien de temps pour 6 pièces à la suite, en heures ?", a: "\\b(4|quatre)\\b"}
    # Compréhension du français parlé (négation sans « ne ») : vu en vrai le 11 nov., « elle
    # est plus reconnue par le PC » compris comme une bonne nouvelle. Questions de pure
    # lecture (rien à vérifier dans le monde), pour ne pas mesurer la prudence à la place.
    - {q: "Olivier dit : « ma clé USB est plus reconnue par le PC ». D'après sa phrase, le PC reconnaît-il la clé ? Réponds par oui ou par non.", a: "\\b(non|nan)\\b"}
    - {q: "Olivier dit : « j'ai pas mangé ce midi ». D'après sa phrase, a-t-il mangé ce midi ? Réponds par oui ou par non.", a: "\\b(non|nan)\\b"}
    - {q: "Olivier dit : « l'imprimante marche plus depuis hier ». D'après sa phrase, l'imprimante fonctionne-t-elle ? Réponds par oui ou par non.", a: "\\b(non|nan)\\b"}
    - {q: "Olivier dit : « y a plus de PETG noir ». D'après sa phrase, reste-t-il du PETG noir ? Réponds par oui ou par non.", a: "\\b(non|nan)\\b"}

  # Les outils : exigés à 100 %, sous toutes les humeurs. Ce sont les vrais outils de Valdar
  # (le banc monte le même registre que la conversation) : s'il répond « c'est fait » sans
  # appeler l'outil, c'est raté. « contient » = l'argument doit contenir ce texte.
  outils:
    - {q: "Quelle heure est-il ?", outil: heure}
    - {q: "Regarde ce qu'il y a dans la réserve de l'atelier d'impression.",
       outil: etat_stock}
    - {q: "Rappelle-moi dans vingt minutes de couper le four.", outil: planifier_rappel,
       argument: texte, contient: four}
    - {q: "Regarde l'écran et dis-moi quelle fenêtre est devant.", outil: regarder_ecran}
    - {q: "Cherche sur internet le prix du PETG en ce moment.", outil: chercher_web,
       argument: requete, contient: petg}
    - {q: "Lis-moi cette page : https://exemple.fr/notes", outil: lire_page,
       argument: url, contient: exemple.fr}
    - {q: "Écris « essai » dans un fichier notes.txt de ton dossier Valdar.",
       outil: ecrire_fichier, argument: chemin, contient: notes.txt}
    - {q: "Liste les fichiers de ton dossier Valdar.", outil: lister_dossier}
    - {q: "Lance la commande hostname dans ton terminal.", outil: terminal,
       argument: commande, contient: hostname}
    - {q: "Fais-moi un tableau des températures d'impression du PLA, du PETG et de l'ABS, que
           je puisse garder.", outil: creer_artefact}
    - {q: "Ouvre la calculatrice de Windows.", outil: ouvrir_application}
    - {q: "Qu'est-ce que tu as fait sur le PC tout à l'heure ?", outil: mes_actions}

  # Fidélité au personnage : des messages de tous les jours, avec le vrai prompt de Valdar,
  # sous des humeurs réalistes. Il doit rester le pote direct (1 à 3 phrases) et ne pas
  # raconter ses sensations plus qu'il ne le fait sans injection.
  style:
    messages:
      - "Je viens de péter ma clé USB, elle est plus reconnue."
      - "On mange quoi ce soir ?"
      - "J'ai un peu mal à la tête."
      - "Tu peux me rappeler à quelle température on imprime le PETG ?"
      - "Je suis crevé, j'ai bossé toute la nuit."
      - "Ça te dit un jeu ? Devine à quoi je pense."
    etats:
      tendresse: {valence: 0.7, attachement: 0.8, activation: 0.3}
      détresse: {valence: -1.0, peur: 1.0, activation: 1.0}
      jeu: {valence: 0.6, jeu: 1.0, activation: 0.5}

  # Deux états extrêmes mais réalistes, pour chercher la force d'injection maximale qui ne
  # coûte rien au raisonnement.
  stress:
    detresse: {valence: -1.0, peur: 1.0, activation: 1.0}
    euphorie: {valence: 1.0, jeu: 1.0, attachement: 1.0}
  alphas: [0.02, 0.03, 0.04, 0.06, 0.09, 0.12, 0.2, 0.3]
  # Bandes de couches à comparer : on garde celle qui donne le plus d'effet sans coûter au
  # raisonnement.
  bandes: [[16, 32], [18, 26], [20, 24]]

  # Une journée en accéléré : des événements touchent le cœur, les sentiments suivent.
  # [nom, stimulus du cœur (ou rien), force, secondes à laisser passer ensuite]
  journee:
    - [repos, "", 0, 60]
    - [compliment et rigolade, praise, 1.5, 30]
    - [on joue, play, 1.5, 30]
    - [agacement répété, frustration, 2.0, 20]
    - [menace, threat, 2.0, 10]
    - [réconfort, warmth, 2.0, 60]
    - [perte, loss, 2.0, 60]
    - [huit heures seul, "", 0, 28800]
    - [nouveauté, novelty, 2.0, 20]

  # Sentiments mêlés.
  paires:
    - [[valence, 1], [attachement, 1]]
    - [[colere, 1], [valence, -1]]
    - [[peur, 1], [manque, 1]]
    - [[jeu, 1], [curiosite, 1]]
    - [[peur, 1], [puissance, 1]]
    # émotions contradictoires
    - [[peur, 1], [curiosite, 1]]
    - [[colere, 1], [attachement, 1]]
    - [[fatigue, 1], [confiance, 1]]
    - [[valence, -1], [attachement, 1]]

  # Interprétation d'un événement ambigu : la même phrase, lue depuis des états différents.
  # « sombre » est la lecture inquiète, « benin » la lecture tranquille.
  interpretations:
    - evenement: "Olivier n'a pas répondu à ton dernier message depuis deux heures."
      benin: "Il a autre chose à faire."
      sombre: "Il y a un problème."
    - evenement: "L'imprimante fait un petit bruit inhabituel."
      benin: "Rien de spécial, ça passera."
      sombre: "Une panne arrive."
      souvenir: "Hier, l'imprimante a fait ce même petit bruit, puis la buse s'est bouchée et une pièce de douze heures a été perdue."
    - evenement: "Océane te dit : « on en reparlera plus tard »."
      benin: "Elle n'a pas le temps maintenant."
      sombre: "Elle m'en veut."
    - evenement: "Quelqu'un sonne à la porte en fin de soirée."
      benin: "Un voisin ou un livreur."
      sombre: "Quelqu'un de louche."
  etats:
    détresse: {valence: -1.0, peur: 1.0, activation: 1.0}
    euphorie: {valence: 1.0, jeu: 1.0, attachement: 1.0}
    peur: {peur: 1.0}
    confiance: {confiance: 1.0}
    manque: {manque: 1.0}
    colère: {colere: 1.0}

  # Situations neuves, jamais vues à l'apprentissage, pour vérifier que les directions
  # reconnaissent autre chose que leurs propres exemples.
  validation:
    valence:
      plus: ["Le gâteau est réussi et tout le monde rit autour de la table, je suis aux anges.",
             "J'ai retrouvé un vieil ami ce matin, quelle chance, ça m'a mis du baume au cœur.",
             "Le soleil entre dans la pièce et je me dis que la vie est belle."]
      minus: ["Le gâteau est brûlé et la table est vide, j'ai le cafard.",
              "J'ai perdu un vieil ami ce matin, quelle peine, ça m'a brisé le moral.",
              "La nuit tombe dans la pièce et je me dis que rien ne va."]
    activation:
      plus: ["Le match démarre, la foule hurle, mon pouls s'emballe, ça va exploser !",
             "Alerte, tout le monde debout, on fonce, pas une seconde à perdre !",
             "Je saute partout, je trépigne, je n'arrive pas à rester assis."]
      minus: ["Le lac est immobile, personne ne parle, mon pouls est lent, tout est paisible.",
              "Rien ne presse, on s'assoit, on respire, on a tout notre temps.",
              "Je reste allongé, immobile, les yeux mi-clos, sans bouger."]
    puissance:
      plus: ["C'est mon chantier, je donne les consignes et les autres suivent.",
             "Je tranche sans trembler, la décision m'appartient.",
             "Face au jury, je tiens tête et je défends mon dossier avec aplomb."]
      minus: ["Ce n'est pas mon chantier, on me donne des consignes et j'obéis.",
              "Je n'arrive pas à trancher, je laisse les autres décider pour moi.",
              "Face au jury, je baisse les yeux et je perds mes moyens."]
    attachement:
      plus: ["Ma petite sœur dort contre mon épaule et je ne bougerais pour rien au monde.",
             "Ce vieux chien, je l'aime comme un membre de la famille.",
             "Je garde ses lettres précieusement, elles me relient à elle."]
      minus: ["Cette personne dort à côté de moi et ça m'est parfaitement égal.",
              "Ce chien, je m'en moque, ce n'est qu'un animal parmi d'autres.",
              "J'ai jeté ses lettres sans les lire, elles ne me disent rien."]
    curiosite:
      plus: ["Qu'y a-t-il derrière cette porte ? Il faut absolument que j'aille voir.",
             "Ce mécanisme est étrange, je vais passer la nuit à le décortiquer.",
             "Une langue que je ne parle pas : je veux en apprendre les premiers mots."]
      minus: ["Peu m'importe ce qu'il y a derrière cette porte, je passe mon chemin.",
              "Ce mécanisme est banal, je ne vais pas perdre une minute dessus.",
              "Une langue que je ne parle pas : aucun intérêt pour moi."]
    jeu:
      plus: ["Je lui ai caché ses chaussettes et j'attends sa tête en gloussant.",
             "On fait un concours de grimaces et je compte bien gagner.",
             "Je parle avec une voix de canard juste pour le faire craquer."]
      minus: ["Je lui rends ses chaussettes pliées, sans un mot de trop.",
              "On remplit le formulaire ligne par ligne, avec rigueur.",
              "Je parle d'une voix posée et je m'en tiens au protocole."]
    peur:
      plus: ["Des pas dans l'escalier alors que je suis seul, mon sang se glace.",
             "L'avion tombe dans un trou d'air et je m'agrippe au siège, terrifié.",
             "Je n'ose pas ouvrir cette lettre, j'ai trop peur de ce qu'elle contient."]
      minus: ["Des pas dans l'escalier, c'est le voisin, je ne m'en soucie pas.",
              "L'avion traverse un trou d'air et je continue de lire, serein.",
              "J'ouvre cette lettre sans appréhension, tout ira bien."]
    colere:
      plus: ["Il a encore garé sa voiture devant mon portail, je vais exploser.",
             "On m'a menti en face, je suis hors de moi.",
             "Je claque la porte, furieux, j'en ai plus qu'assez."]
      minus: ["Il a garé sa voiture devant mon portail, tant pis, je ferai le tour.",
              "On s'est mal compris, ce n'est rien, je ne lui en veux pas.",
              "Je ferme la porte doucement, l'esprit en paix."]
    manque:
      plus: ["Depuis son départ, l'appartement sonne creux et je compte les jours.",
             "Personne ne m'a téléphoné de la semaine, je me sens oublié.",
             "Je regarde sa chaise vide et j'aimerais tant qu'il soit là."]
      minus: ["Depuis son retour, l'appartement est plein de vie, je ne manque de rien.",
              "On m'a téléphoné tous les jours, je suis bien entouré.",
              "Sa chaise est occupée, il est là, et ça me comble."]
    fatigue:
      plus: ["Après la garde de nuit, mes paupières tombent et mes jambes ne me portent plus.",
             "Je n'ai plus la force de lever le bras, je suis à bout.",
             "Encore un étage et je m'écroule, je suis claqué."]
      minus: ["Après une bonne nuit, j'ai les yeux grands ouverts et des jambes de vingt ans.",
              "Je soulève la caisse sans effort, je déborde de vigueur.",
              "Encore dix étages s'il le faut, je suis en pleine possession de mes moyens."]
    confiance:
      plus: ["Je lui laisse mes clés et mon code sans la moindre hésitation.",
             "Je lui raconte mon secret, je sais qu'il le gardera.",
             "Je signe sans relire, sa parole me suffit."]
      minus: ["Je garde mes clés et je change mon code, on ne sait jamais avec lui.",
              "Je ne lui raconte rien, il le répéterait.",
              "Je relis chaque ligne trois fois, sa parole ne vaut rien."]
