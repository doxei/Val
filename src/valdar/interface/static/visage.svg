<svg id="face" viewBox="0 0 400 440" role="img" aria-label="Visage de Valdar">
        <defs>
          <radialGradient id="g-head" cx="50%" cy="38%" r="70%">
            <stop offset="0" stop-color="#3b5578"/>
            <stop offset=".55" stop-color="#1b2c47"/>
            <stop offset="1" stop-color="#0c1628"/>
          </radialGradient>
          <linearGradient id="g-plate" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d9e6f5"/>
            <stop offset=".5" stop-color="#9fb3cc"/>
            <stop offset="1" stop-color="#6d819c"/>
          </linearGradient>
          <linearGradient id="g-visor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#06101f"/>
            <stop offset="1" stop-color="#0b1d36"/>
          </linearGradient>
          <radialGradient id="g-eye" cx="50%" cy="45%" r="60%">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".25" stop-color="var(--eye)"/>
            <stop offset="1" stop-color="var(--eye-deep)"/>
          </radialGradient>
          <radialGradient id="g-cheek" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="var(--cheek)" stop-opacity=".55"/>
            <stop offset="1" stop-color="var(--cheek)" stop-opacity="0"/>
          </radialGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="clip-eye"><ellipse rx="34" ry="30"/></clipPath>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.2"/>
          </filter>
        </defs>

        <!-- halo qui respire au rythme du cœur -->
        <circle id="halo" cx="200" cy="215" r="178" fill="none" stroke="var(--accent)"
                stroke-width="2" opacity=".35"/>
        <circle id="halo2" cx="200" cy="215" r="192" fill="none" stroke="var(--accent)"
                stroke-width="1" stroke-dasharray="4 10" opacity=".25"/>

        <!-- antennes / oreilles -->
        <g id="ears">
          <rect x="38" y="178" width="34" height="86" rx="14" fill="url(#g-plate)"/>
          <rect x="328" y="178" width="34" height="86" rx="14" fill="url(#g-plate)"/>
          <circle id="ear-l" cx="55" cy="221" r="9" fill="var(--ear)" filter="url(#glow)"/>
          <circle id="ear-r" cx="345" cy="221" r="9" fill="var(--ear)" filter="url(#glow)"/>
          <line x1="200" y1="58" x2="200" y2="26" stroke="#9fb3cc" stroke-width="5"
                stroke-linecap="round"/>
          <circle id="antenna" cx="200" cy="22" r="9" fill="var(--accent)" filter="url(#glow)"/>
        </g>

        <!-- tête : un casque clair, un écran sombre dedans -->
        <path id="head" d="M200 56 C292 56 336 112 340 196 C344 286 312 360 254 388
                 C224 402 176 402 146 388 C88 360 56 286 60 196 C64 112 108 56 200 56Z"
              fill="url(#g-plate)"/>
        <path d="M200 56 C292 56 336 112 340 196 C344 286 312 360 254 388
                 C224 402 176 402 146 388 C88 360 56 286 60 196 C64 112 108 56 200 56Z"
              transform="translate(200 228) scale(.94) translate(-200 -228)"
              fill="url(#g-head)"/>
        <path d="M118 92 C150 72 250 72 282 92" fill="none" stroke="#ffffff" stroke-opacity=".18"
              stroke-width="10" stroke-linecap="round"/>
        <!-- liseré doré -->
        <path d="M120 96 Q200 74 280 96" fill="none" stroke="var(--gold)" stroke-width="3"
              stroke-linecap="round" opacity=".85"/>
        <circle cx="200" cy="90" r="5" fill="var(--gold)" filter="url(#glow)"/>

        <!-- joues -->
        <ellipse id="cheek-l" cx="122" cy="276" rx="34" ry="20" fill="url(#g-cheek)"/>
        <ellipse id="cheek-r" cx="278" cy="276" rx="34" ry="20" fill="url(#g-cheek)"/>

        <!-- visière -->
        <rect x="96" y="156" width="208" height="94" rx="47" fill="#0a1a31"
              stroke="var(--accent)" stroke-opacity=".30" stroke-width="2"/>

        <!-- yeux -->
        <g id="eyes">
          <g id="eye-l" transform="translate(150 202)">
            <ellipse rx="36" ry="32" fill="var(--eye)" opacity=".18" filter="url(#glow)"/>
            <g clip-path="url(#clip-eye)">
              <ellipse class="eye-white" rx="34" ry="30" fill="url(#g-eye)"/>
              <circle class="pupil" r="11" fill="#04101f"/>
              <circle class="spark" cx="-7" cy="-9" r="5" fill="#fff" opacity=".9"/>
              <rect class="lid-top" x="-40" y="-100" width="80" height="70" fill="#0a1a31"/>
              <rect class="lid-bot" x="-40" y="30" width="80" height="40" fill="#0a1a31"/>
            </g>
            <ellipse rx="34" ry="30" fill="none" stroke="var(--eye)" stroke-opacity=".5"
                     stroke-width="1.5"/>
          </g>
          <g id="eye-r" transform="translate(250 202)">
            <ellipse rx="36" ry="32" fill="var(--eye)" opacity=".18" filter="url(#glow)"/>
            <g clip-path="url(#clip-eye)">
              <ellipse class="eye-white" rx="34" ry="30" fill="url(#g-eye)"/>
              <circle class="pupil" r="11" fill="#04101f"/>
              <circle class="spark" cx="-7" cy="-9" r="5" fill="#fff" opacity=".9"/>
              <rect class="lid-top" x="-40" y="-100" width="80" height="70" fill="#0a1a31"/>
              <rect class="lid-bot" x="-40" y="30" width="80" height="40" fill="#0a1a31"/>
            </g>
            <ellipse rx="34" ry="30" fill="none" stroke="var(--eye)" stroke-opacity=".5"
                     stroke-width="1.5"/>
          </g>
        </g>

        <!-- sourcils -->
        <path id="brow-l" d="M116 140 Q150 128 184 140" fill="none" stroke="var(--brow)"
              stroke-width="8" stroke-linecap="round"/>
        <path id="brow-r" d="M216 140 Q250 128 284 140" fill="none" stroke="var(--brow)"
              stroke-width="8" stroke-linecap="round"/>

        <!-- bouche -->
        <g id="mouth-g">
          <path id="mouth" d="M156 304 Q200 324 244 304 Q200 330 156 304Z" fill="#04101f"
                stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
          <path id="mouth-glow" d="M164 308 Q200 318 236 308" fill="none"
                stroke="var(--accent)" stroke-width="2" opacity=".0" filter="url(#glow)"/>
        </g>

        <!-- sommeil -->
        <g id="zzz" opacity="0">
          <text x="300" y="120" class="z">z</text>
          <text x="318" y="96" class="z z2">z</text>
          <text x="338" y="70" class="z z3">Z</text>
        </g>
      </svg>
